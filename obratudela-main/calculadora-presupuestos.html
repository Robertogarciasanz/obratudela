    <style>
        :root {
            --orange: #ff6b00;
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2e2e2e;
            --text: #e8e8e8;
            --muted: #888;
            --ai-bg: #1f2937;
            --user-bg: #374151;
            --green: #4caf7d;
            --blue: #3498db;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: var(--surface);
            border-bottom: 2px solid var(--orange);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            flex-shrink: 0;
        }

        .header-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            letter-spacing: 3px;
            color: var(--orange);
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 12px;
            transition: color 0.2s, border-color 0.2s;
        }

        .btn-back:hover {
            color: var(--orange);
            border-color: var(--orange);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 90%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message-content {
            background: var(--ai-bg);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message-content p {
            margin-bottom: 10px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content strong {
            color: var(--orange);
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.user .message-content {
            background: var(--user-bg);
        }

        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            gap: 12px;
        }

        .chat-input-area textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            height: 50px;
        }

        .chat-input-area textarea:focus {
            border-color: var(--orange);
        }

        .chat-input-area button {
            background: var(--orange);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            padding: 0 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background: #e05e00;
        }

        .chat-input-area button:disabled {
            background: var(--muted);
            cursor: not-allowed;
        }

        #presupuestoResultado {
            animation: fadeIn 0.4s;
        }

        #presupuestoResultado h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--orange);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border);
        }

        #presupuestoResultado table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #presupuestoResultado th,
        #presupuestoResultado td {
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        #presupuestoResultado th {
            font-weight: 600;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        #presupuestoResultado .total-row {
            font-weight: 700;
        }

        #presupuestoResultado .total-row.grand-total {
            color: var(--orange);
            font-size: 15px;
            border-top: 2px solid var(--orange);
        }

        .btn-print {
            display: inline-block;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-print:hover {
            border-color: var(--orange);
            color: var(--orange);
        }

        /* --- NUEVOS ESTILOS PARA BÚSQUEDA --- */
        .search-results {
            background: var(--ai-bg);
            border-radius: 12px;
            padding: 12px;
            margin-top: -8px;
            /* Solapar un poco con el mensaje anterior */
        }

        .search-results h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .result-item {
            display: flex;
            gap: 12px;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
            align-items: flex-start;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .result-item-info {
            flex: 1;
        }

        .result-item-res {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 2px;
        }

        .result-item-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        .btn-add-item {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--green);
            font-size: 16px;
            font-weight: 700;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            transition: all 0.2s;
        }

        @media (max-width: 600px) {
            .chat-messages {
                padding: 16px;
            }

            .chat-input-area {
                padding: 12px;
            }

            .message {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-title">🤖 PRESUPUESTO CON IA</div>
        <a href="index.html" class="btn-back">← Volver</a>
    </header>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Mensajes se añadirán aquí -->
        </div>
        <div class="chat-input-area">
            <textarea id="userInput"
                placeholder="Describe tu proyecto. Ej: 'necesito una zanja de 10 metros de largo y 50cm de profundo'"></textarea>
            <button id="sendButton">➤</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const chatMessages = document.getElementById('chatMessages');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');

            let fuse;
            let allItems = [];
            let presupuesto = [];
            let lastParsedQuantity = null; // Variable para guardar la última cantidad detectada

            // --- Carga de la base de datos ---
            try {
                addMessage("<p>Cargando base de datos de precios (+54,000 partidas)...</p>");
                const response = await fetch('precios.json');
                if (!response.ok) throw new Error('No se pudo cargar la base de datos.');
                const data = await response.json();
                allItems = data.items || data;

                const fuseOptions = {
                    keys: [
                        { name: 'res', weight: 0.7 },
                        { name: 'desc', weight: 0.2 },
                        { name: 'cod', weight: 0.1 }
                    ],
                    includeScore: true,
                    threshold: 0.4,
                    minMatchCharLength: 3,
                    ignoreLocation: true,
                };
                fuse = new Fuse(allItems, fuseOptions);

                addMessage("<p>¡Hola! Soy tu asistente de presupuestos.</p><p>Describe lo que necesitas y te ayudaré a encontrar las partidas. Por ejemplo: <code>20 m2 de muro de ladrillo perforado</code>.</p>");

            } catch (error) {
                addMessage(`<p style="color:var(--red)"><strong>Error:</strong> No se pudo cargar la base de datos. La herramienta no funcionará.</p>`);
                console.error(error);
            }

            function addMessage(text, sender = 'ai') {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${sender}`;
                msgDiv.innerHTML = `
                    <div class="avatar">${sender === 'ai' ? '🤖' : '👤'}</div>
                    <div class="message-content">${text}</div>
                `;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            /**
             * Analiza la consulta del usuario para extraer medidas y limpiar el texto de búsqueda.
             * @param {string} query - La entrada del usuario.
             * @returns {{quantity: number|null, cleanedQuery: string}}
             */
            function parseQueryForDimensions(query) {
                let quantity = null;
                let cleanedQuery = query;

                // Regex para encontrar patrones como: 10x5, 10x5x2, 20m2, 50 m3, 100ml, etc.
                // Acepta 'x', 'X', '*', 'por'. Acepta comas y puntos para decimales.
                const regex = /(\d+[\.,]?\d*)\s*(?:x|X|\*|por)\s*(\d+[\.,]?\d*)\s*(?:(?:x|X|\*|por)\s*(\d+[\.,]?\d*))?|(\d+[\.,]?\d*)\s*(m2|m²|m3|m³|ml|metros)/i;

                const match = query.match(regex);

                if (match) {
                    // Elimina la parte de la medida de la consulta para mejorar la búsqueda de texto.
                    cleanedQuery = query.replace(regex, ' ').replace(/\s+/g, ' ').trim();
                    const toNum = s => s ? parseFloat(s.replace(',', '.')) : NaN;

                    const [d1, d2, d3, d4] = [match[1], match[2], match[3], match[4]].map(toNum);

                    if (!isNaN(d1) && !isNaN(d2) && !isNaN(d3)) { // 3D: 10x5x2
                        quantity = d1 * d2 * d3;
                    } else if (!isNaN(d1) && !isNaN(d2)) { // 2D: 10x5
                        quantity = d1 * d2;
                    } else if (!isNaN(d4)) { // 1D con unidad: 20m2
                        quantity = d4;
                    }
                }

                // Guarda la cantidad para usarla al añadir un item.
                lastParsedQuantity = quantity;
                return { quantity, cleanedQuery: cleanedQuery || query };
            }

            function searchAndDisplay(query) {
                const results = fuse.search(query, { limit: 5 });
                if (results.length === 0) {
                    addMessage("<p>No he encontrado partidas que coincidan. Intenta ser más específico o usar otras palabras.</p>");
                    return;
                }

                const itemsHtml = results.map(result => {
                    const item = result.item;
                    return `
                        <div class="result-item">
                            <div class="result-item-info">
                                <div class="result-item-res">${item.res}</div>
                                <div class="result-item-meta">${item.cod} · ${item.precio.toFixed(2)} €/${item.uni}</div>
                            </div>
                            <button class="btn-add-item" title="Añadir al presupuesto" onclick="window.app.addItemToBudget('${item.cod}')">+</button>
                        </div>
                    `;
                }).join('');

                const resultsHtml = `
                    <div class="search-results">
                        <h3>He encontrado estas partidas, ¿cuál quieres añadir?</h3>
                        ${itemsHtml}
                    </div>
                `;
                addMessage(resultsHtml);
            }

            window.app = {
                addItemToBudget: (cod) => {
                    const item = allItems.find(i => i.cod === cod);
                    if (!item) return;

                    // Usar la cantidad detectada en la búsqueda, si existe. Si no, 1.
                    const qtyToAdd = lastParsedQuantity !== null ? lastParsedQuantity : 1;

                    const existing = presupuesto.find(p => p.cod === cod);
                    if (existing) {
                        existing.qty += qtyToAdd;
                    } else {
                        presupuesto.push({ ...item, qty: qtyToAdd });
                    }

                    // Resetea la cantidad para que no se aplique a la siguiente adición manual.
                    lastParsedQuantity = null;
                    generateBudget();
                }
                ,
                updateItemQuantity: (cod, newQty) => {
                    const item = presupuesto.find(p => p.cod === cod);
                    if (!item) return;

                    const qty = parseFloat(String(newQty).replace(',', '.'));
                    // También necesitamos una función para borrar, la añado para el futuro
                    if (qty <= 0) return removeItem(item.cod);
                    if (!isNaN(qty) && qty > 0) {
                        item.qty = qty;
                    }
                    generateBudget(); // Vuelve a generar el presupuesto para actualizar totales
                }
            };

            function generateBudget() {
                // Guardar el presupuesto cada vez que se renderiza
                saveBudget();

                let lineas = [];
                let total = 0;

                const tablaHtml = presupuesto.map(item => {
                    const importe = item.qty * item.precio;
                    total += importe;
                    // Usamos comillas simples para el string y dobles para los atributos HTML
                    return `
        <tr>
          <td>${item.res}</td>
          <td style="text-align:right;">
            <input type="number" value="${item.qty}" onchange="window.app.updateItemQuantity('${item.cod}', this.value)" style="width: 70px; text-align: right; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px; border-radius: 4px; font-size: 13px;">
          </td>
          <td>${item.uni}</td>
          <td style="text-align:right;">${item.precio.toFixed(2)} €</td>
          <td style="text-align:right; font-weight:bold;">${importe.toFixed(2)} €</td>
        </tr>
      `;
                }).join('');

                // Añadir botón para borrar partidas
                const tablaConBorrado = presupuesto.map(item => {
                    const importe = item.qty * item.precio;
                    return `<tr><td>${item.res}</td><td style="text-align:right;"><input type="number" value="${item.qty}" onchange="window.app.updateItemQuantity('${item.cod}', this.value)" style="width: 60px; text-align: right; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px; border-radius: 4px; font-size: 13px;"></td><td>${item.uni}</td><td style="text-align:right;">${item.precio.toFixed(2)} €</td><td style="text-align:right; font-weight:bold;">${importe.toFixed(2)} €</td><td><button onclick="removeItem('${item.cod}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;" title="Eliminar partida">🗑️</button></td></tr>`;
                }).join('');

                const iva = total * 0.21;
                const granTotal = total + iva;

                let existingBudget = document.getElementById('presupuestoResultado');
                if (existingBudget) {
                    existingBudget.parentElement.parentElement.remove();
                }

                const resultadoHtml = `
      <div id="presupuestoResultado" style="display: block;">
        <h3>✅ Presupuesto Estimado</h3>
        <table id="tablaConceptos">
          <thead><tr><th>Concepto</th><th>Cant.</th><th>Ud.</th><th>Precio</th><th>Importe</th><th></th></tr></thead>
          <tbody>${tablaConBorrado}</tbody>
        </table>
        <table id="tablaTotales" style="width: 300px; float: right;">
          <tr class="total-row"><td>Subtotal</td><td style="text-align:right;">${total.toFixed(2)} €</td></tr>
          <tr class="total-row"><td>IVA (21%)</td><td style="text-align:right;">${iva.toFixed(2)} €</td></tr>
          <tr class="total-row grand-total"><td>TOTAL</td><td style="text-align:right; font-size: 16px;">${granTotal.toFixed(2)} €</td></tr>
        </table>
        <div style="clear:both;"></div>
        <p style="font-size:11px; color:var(--muted); margin-top:15px;">*Este es un presupuesto orientativo. Los precios pueden variar. Para un presupuesto cerrado, contacta con nosotros.</p>
        <button class="btn-print" onclick="shareBudget()" style="background:var(--blue);color:#fff;margin-right:10px;">📲 Compartir</button>
        <button class="btn-print" onclick="vaciarPresupuesto()" style="background:var(--user-bg);color:var(--muted);margin-right:10px;">🗑️ Vaciar</button>
        <button class="btn-print" onclick="imprimirPresupuesto()">🖨️ Imprimir</button>
      </div>
    `;

                addMessage(resultadoHtml);
            }

            function handleUserInput() {
                const text = userInput.value.trim();
                if (!text) return;

                addMessage(text, 'user');
                userInput.value = '';
                sendButton.disabled = true;

                setTimeout(() => {
                    if (!fuse) {
                        addMessage("<p>La base de datos aún no está lista. Por favor, espera un momento.</p>");
                        sendButton.disabled = false;
                        return;
                    }
                    // Analiza la consulta antes de buscar
                    const { cleanedQuery } = parseQueryForDimensions(text);
                    // Usa la consulta "limpia" para buscar las partidas
                    searchAndDisplay(cleanedQuery);
                    sendButton.disabled = false;
                }, 500);
            }
            function vaciarPresupuesto() {
                if (confirm('¿Seguro que quieres borrar el presupuesto actual?')) { presupuesto = []; generateBudget(); }
            }

            sendButton.addEventListener('click', handleUserInput);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleUserInput();
                }
            });

            // --- Persistencia con LocalStorage ---
            const STORAGE_KEY = 'ai_budget_obratudela';

            function saveBudget() {
                const encodedBudget = encodeBudgetForUrl(presupuesto);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(presupuesto));
                    // Actualizar la URL sin recargar la página
                    const newUrl = `${window.location.pathname}${encodedBudget ? `?p=${encodedBudget}` : ''}`;
                    history.replaceState({ path: newUrl }, '', newUrl);
                } catch (e) {
                    console.warn("No se pudo guardar el presupuesto en localStorage.", e);
                }
            }

            function encodeBudgetForUrl(budget) {
                if (!budget || budget.length === 0) return '';
                const items = budget.map(item => `${item.cod}:${item.qty}`);
                return btoa(items.join(',')); // Codificar en Base64 para que sea seguro en la URL
            }

            function decodeBudgetFromUrl(encoded) {
                if (!encoded) return [];
                const decodedStr = atob(encoded);
                return decodedStr.split(',').map(part => {
                    const [cod, qty] = part.split(':');
                    return { cod, qty: parseFloat(qty) };
                });
            }

            function loadBudget() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        presupuesto = JSON.parse(saved);
                    }

                    // Prioridad: Cargar desde la URL si existe el parámetro 'p'
                    const urlParams = new URLSearchParams(window.location.search);
                    const budgetParam = urlParams.get('p');
                    if (budgetParam) {
                        const budgetFromUrl = decodeBudgetFromUrl(budgetParam);
                        const loadedItems = budgetFromUrl.map(urlItem => {
                            const fullItem = allItems.find(dbItem => dbItem.cod === urlItem.cod);
                            return fullItem ? { ...fullItem, qty: urlItem.qty } : null;
                        }).filter(Boolean);
                        if (loadedItems.length > 0) {
                            presupuesto = loadedItems;
                        }
                    }

                    if (presupuesto.length > 0) generateBudget();
                } catch (e) {
                    console.error("Error al cargar el presupuesto desde localStorage.", e);
                    localStorage.removeItem(STORAGE_KEY); // Limpiar si está corrupto
                }
            }

            loadBudget(); // Cargar al inicio

        });

        async function shareBudget() {
            if (presupuesto.length === 0) {
                alert("El presupuesto está vacío. Añade alguna partida para compartir.");
                return;
            }

            const shareData = {
                title: 'Presupuesto de Obra - ObraTudela',
                text: 'Aquí tienes un presupuesto estimado generado con la IA de ObraTudela.',
                url: window.location.href // La URL ya contiene el presupuesto
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.error("Error al compartir:", err);
                }
            } else {
                // Fallback para escritorio: copiar al portapapeles
                navigator.clipboard.writeText(window.location.href);
                alert("Enlace del presupuesto copiado al portapapeles. Ahora puedes pegarlo para compartirlo.");
            }
        }

        function imprimirPresupuesto() {
            const tablaConceptos = document.getElementById('tablaConceptos')?.outerHTML;
            const tablaTotales = document.getElementById('tablaTotales')?.outerHTML;

            if (!tablaConceptos) {
