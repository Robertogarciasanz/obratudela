<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Presupuesto Desbroce Terreno</title>
  <meta name="description" content="Calcula presupuesto para desbroce de terreno en tiempo real">
  <link rel="canonical" href="https://www.obratudela.com/calculadora-desbroce.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #ff6b00;
      --text: #222;
      --bg: #f9f9f9;
      --border: #ddd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: var(--orange);
      margin-bottom: 30px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
    }

    .input-group {
      display: flex;
      gap: 12px;
    }

    .input-group input {
      flex: 1;
    }

    .unit {
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #f0f0f0;
      border-radius: 4px;
      font-weight: 600;
      color: #666;
    }

    button {
      background: var(--orange);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover {
      background: #e05e00;
    }

    .resultado {
      margin-top: 40px;
      padding: 24px;
      background: #f9f9f9;
      border-left: 4px solid var(--orange);
      border-radius: 4px;
      display: none;
    }

    .resultado.activo {
      display: block;
    }

    .precio-total {
      font-size: 28px;
      font-weight: 700;
      color: var(--orange);
      margin: 16px 0;
    }

    .desglose {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .linea-presupuesto {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .linea-presupuesto:last-child {
      border-bottom: none;
    }

    .linea-presupuesto strong {
      color: var(--text);
    }

    .total-linea {
      text-align: right;
      font-weight: 600;
      color: var(--orange);
    }

    .info {
      background: #e8f4f8;
      border-left: 4px solid #0096d6;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 12px;
      color: #333;
    }

    .botones-export {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: #666;
      flex: 1;
      font-size: 13px;
      padding: 10px;
    }

    .btn-secondary:hover {
      background: #555;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--orange);
    }

    #estado {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌿 Calculadora Desbroce del Terreno</h1>

  <div id="estado">
    ⏳ Cargando precios de la base de datos...
  </div>

  <div class="form-group">
    <label for="metros">Superficie a desbrocar</label>
    <div class="input-group">
      <input type="number" id="metros" placeholder="Ej: 200, 500, 1000..." min="1" max="100000" value="">
      <div class="unit">m²</div>
    </div>
    <div class="info">💡 Especifica los metros cuadrados. Los precios se cargan dinámicamente de tu base de datos.</div>
  </div>

  <div class="form-group">
    <label for="tipo">Tipo de desbroce</label>
    <select id="tipo">
      <option value="basico">Básico (máquina + tierra vegetal)</option>
      <option value="completo">Completo (máquina + tala árboles + tierra vegetal)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="iva">IVA</label>
    <select id="iva">
      <option value="21">21% (España estándar)</option>
      <option value="10">10% (Reducido)</option>
      <option value="4">4% (Superreducido)</option>
      <option value="0">0% (Sin IVA)</option>
    </select>
  </div>

  <button onclick="calcular()">Calcular Presupuesto</button>

  <div class="resultado" id="resultado">
    <h2>📊 Presupuesto Calculado</h2>

    <div class="desglose" id="desglose"></div>

    <div style="text-align: right; margin-top: 20px;">
      <div style="font-size: 13px; color: #666; margin-bottom: 8px;">Total sin IVA</div>
      <div id="totalSinIVA" style="font-size: 20px; font-weight: 600; margin-bottom: 16px;"></div>

      <div style="font-size: 13px; color: #666; margin-bottom: 8px;">IVA</div>
      <div id="importeIVA" style="font-size: 16px; font-weight: 600; margin-bottom: 16px;"></div>

      <div class="precio-total">Total con IVA: <span id="totalConIVA">€0,00</span></div>
    </div>

    <div class="botones-export">
      <button class="btn-secondary" onclick="exportarJSON()">📥 Descargar JSON</button>
      <button class="btn-secondary" onclick="exportarCSV()">📊 Descargar CSV</button>
      <button class="btn-secondary" onclick="imprimirPresupuesto()">🖨️ Imprimir</button>
    </div>
  </div>
</div>

<script>
// Precios BCEXTREM 2026
const CODIGOS = {
  desbroceBasico: ['E02AM010', 'E02AA020', 'G01C030'],
  desbroceCompleto: ['E02AM010', 'E02AM030', 'E02AA020', 'G01C030']
};

let precios = {};

async function cargarPrecios() {
  try {
    const response = await fetch('precios.json');
    const data = await response.json();
    const items = data.items || [];

    // Buscar códigos
    const codigos = ['E02AM010', 'E02AA020', 'E02AM030', 'G01C030'];
    for (const codigo of codigos) {
      const item = items.find(i => i.cod === codigo);
      if (item) {
        precios[codigo] = {
          desc: item.res,
          precio: item.precio,
          unidad: item.uni
        };
      }
    }

    console.log('✅ Precios cargados:', precios);
    document.getElementById('estado').innerHTML = '✅ Base de datos cargada correctamente';
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('estado').innerHTML = '⚠️ Usando precios por defecto.';
    precios = {
      'E02AM010': { desc: 'Desbroce máquina', precio: 0.68, unidad: 'm2' },
      'E02AA020': { desc: 'Retirada tierra vegetal', precio: 5.13, unidad: 'm2' },
      'E02AM030': { desc: 'Limpieza, tala árboles', precio: 3.54, unidad: 'm2' },
      'G01C030': { desc: 'Carga restos camión', precio: 2.65, unidad: 'm3' }
    };
  }
}

function calcular() {
  if (!precios['E02AM010']) {
    alert('Cargando precios, por favor espera...');
    return;
  }

  const metros = parseFloat(document.getElementById('metros').value) || 0;
  const tipo = document.getElementById('tipo').value;
  const ivaPorc = parseFloat(document.getElementById('iva').value);

  if (metros <= 0) {
    alert('Por favor ingresa metros válidos');
    return;
  }

  const volumenRestos = metros * 0.15;
  let lineas = [];
  let html = '';

  if (tipo === 'basico') {
    lineas = [
      { codigo: 'E02AM010', desc: precios['E02AM010'].desc, cant: metros, unit: 'm2', precio: 0.68 },
      { codigo: 'E02AA020', desc: precios['E02AA020'].desc, cant: metros, unit: 'm2', precio: 5.13 },
      { codigo: 'G01C030', desc: precios['G01C030'].desc, cant: volumenRestos, unit: 'm3', precio: 2.65 }
    ];
  } else {
    lineas = [
      { codigo: 'E02AM010', desc: precios['E02AM010'].desc, cant: metros, unit: 'm2', precio: 0.68 },
      { codigo: 'E02AM030', desc: precios['E02AM030'].desc, cant: metros, unit: 'm2', precio: 3.54 },
      { codigo: 'E02AA020', desc: precios['E02AA020'].desc, cant: metros, unit: 'm2', precio: 5.13 },
      { codigo: 'G01C030', desc: precios['G01C030'].desc, cant: volumenRestos, unit: 'm3', precio: 2.65 }
    ];
  }

  const sinIVA = lineas.reduce((sum, l) => sum + (l.cant * l.precio), 0);
  const importeIVA = sinIVA * (ivaPorc / 100);
  const conIVA = sinIVA + importeIVA;

  lineas.forEach(l => {
    const subtotal = l.cant * l.precio;
    html += `<div class="linea-presupuesto">
      <strong>${l.desc} (${l.codigo})</strong>
      <span>${l.cant.toFixed(2)} ${l.unit} × €${l.precio.toFixed(2)}</span>
      <span class="total-linea">€${subtotal.toFixed(2)}</span>
    </div>`;
  });

  document.getElementById('desglose').innerHTML = html;
  document.getElementById('totalSinIVA').textContent = `€${sinIVA.toFixed(2)}`;
  document.getElementById('importeIVA').textContent = `€${importeIVA.toFixed(2)} (${ivaPorc}%)`;
  document.getElementById('totalConIVA').textContent = `€${conIVA.toFixed(2)}`;

  window.presupuestoData = { metros, tipo, ivaPorc, lineas, sinIVA, importeIVA, conIVA, volumenRestos };
  document.getElementById('resultado').classList.add('activo');
}

function exportarJSON() {
  const data = window.presupuestoData;
  const json = {
    titulo: 'Desbroce del Terreno',
    metros: data.metros,
    tipo: data.tipo,
    lineas: data.lineas.map(l => ({
      codigo: l.codigo,
      descripcion: l.desc,
      cantidad: l.cant,
      unidad: l.unit,
      precio: l.precio,
      subtotal: l.cant * l.precio
    })),
    totales: {
      sin_iva: data.sinIVA,
      iva: data.ivaPorc,
      iva_importe: data.importeIVA,
      con_iva: data.conIVA
    }
  };
  const blob = new Blob([JSON.stringify(json, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-desbroce-${data.metros}m2.json`;
  a.click();
}

function exportarCSV() {
  const data = window.presupuestoData;
  let csv = 'Código,Concepto,Cantidad,Unidad,Precio Unitario,Subtotal\n';
  data.lineas.forEach(l => {
    csv += `${l.codigo},"${l.desc}",${l.cant.toFixed(2)},${l.unit},${l.precio},${(l.cant * l.precio).toFixed(2)}\n`;
  });
  csv += `,,TOTAL SIN IVA,,,${data.sinIVA.toFixed(2)}\n`;
  csv += `,,IVA ${data.ivaPorc}%,,,${data.importeIVA.toFixed(2)}\n`;
  csv += `,,TOTAL CON IVA,,,${data.conIVA.toFixed(2)}`;

  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-desbroce-${data.metros}m2.csv`;
  a.click();
}

function imprimirPresupuesto() {
  window.print();
}

window.addEventListener('DOMContentLoaded', async () => {
  await cargarPrecios();
});
