<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Presupuesto Demolición Aceras</title>
  <meta name="description" content="Calcula presupuesto para demolición de aceras en tiempo real">
  <link rel="canonical" href="https://www.obratudela.com/calculadora-aceras.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #ff6b00;
      --text: #222;
      --bg: #f9f9f9;
      --border: #ddd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: var(--orange);
      margin-bottom: 30px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
    }

    .input-group {
      display: flex;
      gap: 12px;
    }

    .input-group input {
      flex: 1;
    }

    .unit {
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #f0f0f0;
      border-radius: 4px;
      font-weight: 600;
      color: #666;
    }

    button {
      background: var(--orange);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover {
      background: #e05e00;
    }

    .resultado {
      margin-top: 40px;
      padding: 24px;
      background: #f9f9f9;
      border-left: 4px solid var(--orange);
      border-radius: 4px;
      display: none;
    }

    .resultado.activo {
      display: block;
    }

    .precio-total {
      font-size: 28px;
      font-weight: 700;
      color: var(--orange);
      margin: 16px 0;
    }

    .desglose {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .linea-presupuesto {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .linea-presupuesto:last-child {
      border-bottom: none;
    }

    .linea-presupuesto strong {
      color: var(--text);
    }

    .total-linea {
      text-align: right;
      font-weight: 600;
      color: var(--orange);
    }

    .info {
      background: #e8f4f8;
      border-left: 4px solid #0096d6;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 12px;
      color: #333;
    }

    .botones-export {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: #666;
      flex: 1;
      font-size: 13px;
      padding: 10px;
    }

    .btn-secondary:hover {
      background: #555;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--orange);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏗️ Calculadora Presupuesto Demolición Aceras</h1>

  <div id="estado" style="background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 13px;">
    ⏳ Cargando precios de la base de datos...
  </div>

  <div class="form-group">
    <label for="metros">Superficie de aceras a demoler</label>
    <div class="input-group">
      <input type="number" id="metros" placeholder="Ej: 150, 200, 500..." min="1" max="10000" value="">
      <div class="unit">m²</div>
    </div>
    <div class="info">💡 Especifica los metros cuadrados de acera a demoler. Los precios se cargan dinámicamente de tu base de datos.</div>
  </div>

  <div class="form-group">
    <label for="iva">IVA</label>
    <select id="iva">
      <option value="21">21% (España estándar)</option>
      <option value="10">10% (Reducido)</option>
      <option value="4">4% (Superreducido)</option>
      <option value="0">0% (Sin IVA)</option>
    </select>
  </div>

  <button onclick="calcular()">Calcular Presupuesto</button>

  <div class="resultado" id="resultado">
    <h2>📊 Presupuesto Calculado</h2>

    <div class="desglose" id="desglose"></div>

    <div style="text-align: right; margin-top: 20px;">
      <div style="font-size: 13px; color: #666; margin-bottom: 8px;">Total sin IVA</div>
      <div id="totalSinIVA" style="font-size: 20px; font-weight: 600; margin-bottom: 16px;"></div>

      <div style="font-size: 13px; color: #666; margin-bottom: 8px;">IVA</div>
      <div id="importeIVA" style="font-size: 16px; font-weight: 600; margin-bottom: 16px;"></div>

      <div class="precio-total">Total con IVA: <span id="totalConIVA">€0,00</span></div>
    </div>

    <div class="botones-export">
      <button class="btn-secondary" onclick="exportarJSON()">📥 Descargar JSON</button>
      <button class="btn-secondary" onclick="exportarCSV()">📊 Descargar CSV</button>
      <button class="btn-secondary" onclick="imprimirPresupuesto()">🖨️ Imprimir</button>
    </div>
  </div>
</div>

<script>
// Códigos de partidas a buscar en la base de datos
const CODIGOS = {
  demolicion: 'E01EPS050',
  retirada: 'E01AL020',
  carga: 'G01C020',
  transporte: 'G01C030'
};

let precios = {}; // Se carga desde el JSON

// Cargar precios desde la base de datos JSON
async function cargarPrecios() {
  try {
    const response = await fetch('precios.json');
    const data = await response.json();
    const items = data.items || [];

    // Buscar cada código en la base de datos
    for (const [tipo, codigo] of Object.entries(CODIGOS)) {
      const item = items.find(i => i.cod === codigo);
      if (item) {
        precios[tipo] = {
          codigo: item.cod,
          desc: item.res,
          descLarga: item.desc,
          precio: item.precio,
          unidad: item.uni
        };
      }
    }

    console.log('✅ Precios cargados desde base de datos:', precios);
    document.getElementById('estado').innerHTML = '✅ Base de datos cargada correctamente';
  } catch (error) {
    console.error('❌ Error cargando precios:', error);
    document.getElementById('estado').innerHTML = '❌ Error al cargar la base de datos. Usando precios por defecto.';
    // Precios por defecto si falla la carga
    precios = {
      demolicion: { codigo: 'E01EPS050', desc: 'Demolición pavimento hormigón', precio: 16.51, unidad: 'm2' },
      retirada: { codigo: 'E01AL020', desc: 'Limpieza local existente', precio: 10.62, unidad: 'm2' },
      carga: { codigo: 'G01C020', desc: 'Carga escombros dumper', precio: 19.97, unidad: 'm3' },
      transporte: { codigo: 'G01C030', desc: 'Carga escombros camión', precio: 2.65, unidad: 'm3' }
    };
  }
}

function calcular() {
  if (!precios.demolicion) {
    alert('Error: Los precios aún se están cargando. Por favor espera un momento e intenta de nuevo.');
    return;
  }

  const metros = parseFloat(document.getElementById('metros').value) || 0;
  const ivaPorc = parseFloat(document.getElementById('iva').value);

  if (metros <= 0) {
    alert('Por favor ingresa una cantidad válida de metros cuadrados');
    return;
  }

  // Volumen de escombros aproximado (0.25 m³ por m²)
  const volumenEscombros = Math.round(metros * 0.25 * 10) / 10;

  // Calcular subtotales
  const subtotal1 = metros * precios.demolicion.precio;
  const subtotal2 = metros * precios.retirada.precio;
  const subtotal3 = volumenEscombros * precios.carga.precio;
  const subtotal4 = volumenEscombros * precios.transporte.precio;

  const totalSinIVA = subtotal1 + subtotal2 + subtotal3 + subtotal4;
  const importeIVA = totalSinIVA * (ivaPorc / 100);
  const totalConIVA = totalSinIVA + importeIVA;

  // Mostrar desglose
  const desglose = document.getElementById('desglose');
  desglose.innerHTML = `
    <div class="linea-presupuesto">
      <strong>${precios.demolicion.desc} (${precios.demolicion.codigo})</strong>
      <span>${metros} m² × €${precios.demolicion.precio.toFixed(2)}</span>
      <span class="total-linea">€${subtotal1.toFixed(2)}</span>
    </div>
    <div class="linea-presupuesto">
      <strong>${precios.retirada.desc} (${precios.retirada.codigo})</strong>
      <span>${metros} m² × €${precios.retirada.precio.toFixed(2)}</span>
      <span class="total-linea">€${subtotal2.toFixed(2)}</span>
    </div>
    <div class="linea-presupuesto">
      <strong>${precios.carga.desc} (${precios.carga.codigo})</strong>
      <span>${volumenEscombros} m³ × €${precios.carga.precio.toFixed(2)}</span>
      <span class="total-linea">€${subtotal3.toFixed(2)}</span>
    </div>
    <div class="linea-presupuesto">
      <strong>${precios.transporte.desc} (${precios.transporte.codigo})</strong>
      <span>${volumenEscombros} m³ × €${precios.transporte.precio.toFixed(2)}</span>
      <span class="total-linea">€${subtotal4.toFixed(2)}</span>
    </div>
  `;

  // Mostrar totales
  document.getElementById('totalSinIVA').textContent = `€${totalSinIVA.toFixed(2)}`;
  document.getElementById('importeIVA').textContent = `€${importeIVA.toFixed(2)} (${ivaPorc}%)`;
  document.getElementById('totalConIVA').textContent = `€${totalConIVA.toFixed(2)}`;

  // Guardar datos para exportación
  window.presupuestoData = {
    metros, volumenEscombros, ivaPorc, totalSinIVA, importeIVA, totalConIVA,
    subtotal1, subtotal2, subtotal3, subtotal4
  };

  // Mostrar resultado
  document.getElementById('resultado').classList.add('activo');
}

function exportarJSON() {
  const data = window.presupuestoData;
  const json = {
    titulo: 'Demolición de Aceras',
    metros_cuadrados: data.metros,
    volumen_escombros: data.volumenEscombros,
    lineas: [
      { codigo: 'E01EPS050', descripcion: precios.demolicion.desc, cantidad: data.metros, unidad: 'm²', precio: precios.demolicion.precio, subtotal: data.subtotal1 },
      { codigo: 'E01AL020', descripcion: precios.retirada.desc, cantidad: data.metros, unidad: 'm²', precio: precios.retirada.precio, subtotal: data.subtotal2 },
      { codigo: 'G01C020', descripcion: precios.carga.desc, cantidad: data.volumenEscombros, unidad: 'm³', precio: precios.carga.precio, subtotal: data.subtotal3 },
      { codigo: 'G01C030', descripcion: precios.transporte.desc, cantidad: data.volumenEscombros, unidad: 'm³', precio: precios.transporte.precio, subtotal: data.subtotal4 }
    ],
    totales: {
      sin_iva: data.totalSinIVA,
      iva_porcentaje: data.ivaPorc,
      iva_importe: data.importeIVA,
      con_iva: data.totalConIVA
    },
    fecha: new Date().toISOString().split('T')[0]
  };

  const blob = new Blob([JSON.stringify(json, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-aceras-${data.metros}m2.json`;
  a.click();
}

function exportarCSV() {
  const data = window.presupuestoData;
  const csv = `Código,Concepto,Cantidad,Unidad,Precio Unitario,Subtotal
E01EPS050,${precios.demolicion.desc},${data.metros},m²,${precios.demolicion.precio},${data.subtotal1}
E01AL020,${precios.retirada.desc},${data.metros},m²,${precios.retirada.precio},${data.subtotal2}
G01C020,${precios.carga.desc},${data.volumenEscombros},m³,${precios.carga.precio},${data.subtotal3}
G01C030,${precios.transporte.desc},${data.volumenEscombros},m³,${precios.transporte.precio},${data.subtotal4}
,TOTAL SIN IVA,,,${data.totalSinIVA}
,IVA ${data.ivaPorc}%,,,${data.importeIVA}
,TOTAL CON IVA,,,${data.totalConIVA}`;

  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-aceras-${data.metros}m2.csv`;
  a.click();
}

function imprimirPresupuesto() {
  window.print();
}

// Cargar precios y calcular automáticamente
window.addEventListener('DOMContentLoaded', async () => {
  await cargarPrecios();
  calcular();
});
