<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Presupuestos con IA — ObraTudela</title>
  <meta name="description" content="Generador de presupuestos inteligente con IA. Presupuestos para aceras, desbroce y demoliciones en Tudela de Duero.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #ff6b00;
      --orange-hover: #e05e00;
      --text: #222;
      --text-light: #666;
      --bg: #f9f9f9;
      --border: #ddd;
      --surface: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      background: linear-gradient(135deg, var(--orange) 0%, #e05e00 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header h1 { font-size: 32px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-light);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--orange); }
    .tab-btn.activo { color: var(--orange); border-bottom-color: var(--orange); }
    .tab-content { display: none; background: var(--surface); padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .tab-content.activo { display: block; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
    }
    textarea { min-height: 120px; resize: vertical; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .input-group { display: flex; gap: 12px; }
    .input-group input { flex: 1; }
    .unit { display: flex; align-items: center; padding: 0 12px; background: #f0f0f0; border-radius: 4px; font-weight: 600; color: #666; white-space: nowrap; }
    button.calcular {
      background: var(--orange);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button.calcular:hover { background: var(--orange-hover); }
    .resultado { margin-top: 40px; padding: 24px; background: #f9f9f9; border-left: 4px solid var(--orange); border-radius: 4px; display: none; }
    .resultado.activo { display: block; }
    .precio-total { font-size: 32px; font-weight: 700; color: var(--orange); margin: 16px 0; text-align: center; }
    .desglose { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
    .linea-presupuesto { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .linea-presupuesto:last-child { border-bottom: none; }
    .total-linea { text-align: right; font-weight: 600; color: var(--orange); }
    .info { background: #e8f4f8; border-left: 4px solid #0096d6; padding: 12px; border-radius: 4px; font-size: 13px; margin-top: 12px; color: #333; }
    .totales-resumen { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 20px; text-align: center; }
    .total-item { padding: 16px; background: white; border-radius: 4px; border: 1px solid var(--border); }
    .total-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
    .total-valor { font-size: 20px; font-weight: 700; color: var(--orange); }
    .botones-export { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn-secondary {
      background: #666;
      color: white;
      border: none;
      flex: 1;
      font-size: 13px;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      min-width: 150px;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #555; }
    h2 { font-size: 16px; margin-bottom: 12px; color: var(--orange); }
    .loading { text-align: center; padding: 20px; color: #666; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid var(--orange); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error { background: #fee; border: 1px solid #fcc; color: #c33; padding: 12px; border-radius: 4px; margin: 12px 0; }
    .success { background: #efe; border: 1px solid #cfc; color: #3c3; padding: 12px; border-radius: 4px; margin: 12px 0; }
    @media (max-width: 768px) {
      .input-row { grid-template-columns: 1fr; }
      .linea-presupuesto { grid-template-columns: 1.5fr 1fr 1fr; }
      .totales-resumen { grid-template-columns: 1fr; }
    }

    /* ESTILOS DE IMPRESIÓN */
    @media print {
      body { background: white; }
      .header { display: none !important; }
      .tabs { display: none !important; }
      .tab-btn { display: none !important; }
      .form-group { display: none !important; }
      button { display: none !important; }
      .botones-export { display: none !important; }
      .container { max-width: 100%; padding: 0; }

      /* Header de impresión con logo */
      .resultado::before {
        content: "";
        display: block;
        width: 150px;
        height: 60px;
        background-image: url('img/logo.jpg');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: left center;
        margin-bottom: 20px;
      }

      .resultado::after {
        content: "Excavaciones y Servicios Arturo S.L. | NIF: B47489612 | Tel: 607 444 903 | www.obratudela.com";
        display: block;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #ddd;
        font-size: 10px;
        color: #666;
        text-align: center;
      }

      .resultado {
        display: block !important;
        background: white;
        border: none;
        padding: 20px;
        page-break-inside: avoid;
      }

      h2 {
        color: #000 !important;
        font-size: 18px;
        margin-top: 20px;
      }

      .linea-presupuesto {
        border-bottom: 1px solid #ddd;
        page-break-inside: avoid;
      }

      .total-linea { color: #000 !important; }
      .total-valor { color: #000 !important; }
      .total-item { border: 1px solid #ddd; }
    }
  </style>
</head>
<body>

<div class="header">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
    <a href="index.html" style="color: white; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px;">
      ← Volver al inicio
    </a>
  </div>
  <h1>💰 Calculadora de Presupuestos</h1>
  <p>Cálculo automático de presupuestos</p>
</div>

<div class="container">
  <!-- TAB: IA (ÚNICA) -->
  <div id="ia" class="tab-content activo">
    <h2>🤖 Generador de Presupuestos con IA</h2>
    <p style="color: #666; margin-bottom: 20px;">Describe tu proyecto y la IA generará un presupuesto automáticamente</p>
    <div class="form-group">
      <label for="descripcion-ia">Descripción del proyecto</label>
      <textarea id="descripcion-ia" placeholder="Ejemplo: Demolición de una casa de 300m² con 2 plantas en Tudela de Duero. La estructura es de hormigón armado con muros de ladrillo."></textarea>
    </div>
    <div class="form-group">
      <label for="iva-ia">IVA</label>
      <select id="iva-ia">
        <option value="21">21% (España estándar)</option>
        <option value="10">10% (Reducido)</option>
        <option value="0">0% (Sin IVA)</option>
      </select>
    </div>
    <button class="calcular" onclick="generarPresupuestoIA()">Generar Presupuesto con IA</button>
    <div id="resultado-ia" class="resultado">
      <h2>📊 Presupuesto Generado</h2>
      <div id="contenido-ia"></div>
      <div class="botones-export">
        <button class="btn-secondary" onclick="exportarJSON('ia')">📥 JSON</button>
        <button class="btn-secondary" onclick="imprimirPresupuesto()">🖨️ Imprimir</button>
      </div>
    </div>
  </div>
</div>

<script>
const PRECIOS = {
  'E01EPS050': { desc: 'Demolición hormigón armado', precio: 16.51, unidad: 'm²' },
  'E01AL020': { desc: 'Limpieza y retirada', precio: 10.62, unidad: 'm²' },
  'G01C020': { desc: 'Carga y descarga dumper', precio: 19.97, unidad: 'm³' },
  'G01C030': { desc: 'Carga y descarga camión', precio: 2.65, unidad: 'm³' },
  'E02AM010': { desc: 'Desbroce con máquina', precio: 0.68, unidad: 'm²' },
  'E02AA020': { desc: 'Retirada tierra vegetal', precio: 5.13, unidad: 'm²' },
  'E02AM030': { desc: 'Tala y desrame árboles', precio: 3.54, unidad: 'm²' },
  'E01ECC030': { desc: 'Demolición cubierta', precio: 7.49, unidad: 'm²' },
  'E01EFBF050': { desc: 'Demolición tabiques', precio: 4.86, unidad: 'm²' },
  'E01EPP030': { desc: 'Demolición pisos', precio: 5.82, unidad: 'm²' },
  'E01EFBF140': { desc: 'Demolición muros', precio: 12.20, unidad: 'm²' },
  'E02AA010': { desc: 'Limpieza terreno', precio: 4.21, unidad: 'm²' }
};

function mostrarTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('activo'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('activo'));
  document.getElementById(tab).classList.add('activo');
  event.target.classList.add('activo');
}

// ACERAS
function calcularAceras() {
  const metros = parseFloat(document.getElementById('metros-aceras').value) || 0;
  const iva = parseFloat(document.getElementById('iva-aceras').value);
  if (metros <= 0) { alert('Ingresa metros válidos'); return; }

  const volumen = metros * 0.25;
  const lineas = [
    { cod: 'E01EPS050', desc: PRECIOS['E01EPS050'].desc, cant: metros, unit: 'm²', precio: 16.51 },
    { cod: 'E01AL020', desc: PRECIOS['E01AL020'].desc, cant: metros, unit: 'm²', precio: 10.62 },
    { cod: 'G01C020', desc: PRECIOS['G01C020'].desc, cant: volumen, unit: 'm³', precio: 19.97 },
    { cod: 'G01C030', desc: PRECIOS['G01C030'].desc, cant: volumen, unit: 'm³', precio: 2.65 }
  ];

  let html = '';
  const sinIVA = lineas.reduce((sum, l) => {
    const sub = l.cant * l.precio;
    html += `<div class="linea-presupuesto"><strong>${l.desc}</strong><span>${l.cant.toFixed(2)} ${l.unit}</span><span class="total-linea">€${sub.toFixed(2)}</span></div>`;
    return sum + sub;
  }, 0);

  const ivaImporte = sinIVA * (iva / 100);
  const conIVA = sinIVA + ivaImporte;

  document.getElementById('desglose-aceras').innerHTML = html;
  document.getElementById('siniva-aceras').textContent = `€${sinIVA.toFixed(2)}`;
  document.getElementById('iva-aceras-valor').textContent = `€${ivaImporte.toFixed(2)}`;
  document.getElementById('total-aceras').textContent = `€${conIVA.toFixed(2)}`;
  document.getElementById('resultado-aceras').classList.add('activo');
  window.presupuestoActual = { lineas, sinIVA, ivaImporte, conIVA, tipo: 'aceras' };
}

// DESBROCE
function calcularDesbroce() {
  const metros = parseFloat(document.getElementById('metros-desbroce').value) || 0;
  const tipo = document.getElementById('tipo-desbroce').value;
  const iva = parseFloat(document.getElementById('iva-desbroce').value);
  if (metros <= 0) { alert('Ingresa metros válidos'); return; }

  const volumen = metros * 0.15;
  let lineas = tipo === 'basico'
    ? [
        { cod: 'E02AM010', desc: PRECIOS['E02AM010'].desc, cant: metros, unit: 'm²', precio: 0.68 },
        { cod: 'E02AA020', desc: PRECIOS['E02AA020'].desc, cant: metros, unit: 'm²', precio: 5.13 },
        { cod: 'G01C030', desc: PRECIOS['G01C030'].desc, cant: volumen, unit: 'm³', precio: 2.65 }
      ]
    : [
        { cod: 'E02AM010', desc: PRECIOS['E02AM010'].desc, cant: metros, unit: 'm²', precio: 0.68 },
        { cod: 'E02AM030', desc: PRECIOS['E02AM030'].desc, cant: metros, unit: 'm²', precio: 3.54 },
        { cod: 'E02AA020', desc: PRECIOS['E02AA020'].desc, cant: metros, unit: 'm²', precio: 5.13 },
        { cod: 'G01C030', desc: PRECIOS['G01C030'].desc, cant: volumen, unit: 'm³', precio: 2.65 }
      ];

  let html = '';
  const sinIVA = lineas.reduce((sum, l) => {
    const sub = l.cant * l.precio;
    html += `<div class="linea-presupuesto"><strong>${l.desc}</strong><span>${l.cant.toFixed(2)} ${l.unit}</span><span class="total-linea">€${sub.toFixed(2)}</span></div>`;
    return sum + sub;
  }, 0);

  const ivaImporte = sinIVA * (iva / 100);
  const conIVA = sinIVA + ivaImporte;

  document.getElementById('desglose-desbroce').innerHTML = html;
  document.getElementById('siniva-desbroce').textContent = `€${sinIVA.toFixed(2)}`;
  document.getElementById('iva-desbroce-valor').textContent = `€${ivaImporte.toFixed(2)}`;
  document.getElementById('total-desbroce').textContent = `€${conIVA.toFixed(2)}`;
  document.getElementById('resultado-desbroce').classList.add('activo');
  window.presupuestoActual = { lineas, sinIVA, ivaImporte, conIVA, tipo: 'desbroce' };
}

// DEMOLICIÓN
function calcularDemolicion() {
  const metros = parseFloat(document.getElementById('metros-demolicion').value) || 0;
  const plantas = parseInt(document.getElementById('plantas-demolicion').value) || 1;
  const iva = parseFloat(document.getElementById('iva-demolicion').value);
  if (metros <= 0) { alert('Ingresa metros válidos'); return; }

  const cubierta = metros * 1.1;
  const tabiques = (metros / plantas) * 1.5 * plantas;
  const pisos = metros;
  const muros = (Math.sqrt(metros) * 4) * (3 * plantas);
  const escombros = metros * (5 + plantas) / 10;

  const lineas = [
    { cod: 'E01ECC030', desc: PRECIOS['E01ECC030'].desc, cant: cubierta, unit: 'm²', precio: 7.49 },
    { cod: 'E01EFBF050', desc: PRECIOS['E01EFBF050'].desc, cant: tabiques, unit: 'm²', precio: 4.86 },
    { cod: 'E01EPP030', desc: PRECIOS['E01EPP030'].desc, cant: pisos, unit: 'm²', precio: 5.82 },
    { cod: 'E01EFBF140', desc: PRECIOS['E01EFBF140'].desc, cant: muros, unit: 'm²', precio: 12.2 },
    { cod: 'E02AA010', desc: PRECIOS['E02AA010'].desc, cant: metros, unit: 'm²', precio: 4.21 },
    { cod: 'G01C030', desc: PRECIOS['G01C030'].desc, cant: escombros, unit: 'm³', precio: 2.65 }
  ];

  let html = '';
  const sinIVA = lineas.reduce((sum, l) => {
    const sub = l.cant * l.precio;
    html += `<div class="linea-presupuesto"><strong>${l.desc}</strong><span>${l.cant.toFixed(2)} ${l.unit}</span><span class="total-linea">€${sub.toFixed(2)}</span></div>`;
    return sum + sub;
  }, 0);

  const ivaImporte = sinIVA * (iva / 100);
  const conIVA = sinIVA + ivaImporte;
  const plazo = `${Math.ceil(metros / 50)}-${Math.ceil(metros / 30)} días`;

  document.getElementById('desglose-demolicion').innerHTML = html;
  document.getElementById('siniva-demolicion').textContent = `€${sinIVA.toFixed(2)}`;
  document.getElementById('iva-demolicion-valor').textContent = `€${ivaImporte.toFixed(2)}`;
  document.getElementById('total-demolicion').textContent = `€${conIVA.toFixed(2)}`;
  document.getElementById('resultado-demolicion').classList.add('activo');
  window.presupuestoActual = { lineas, sinIVA, ivaImporte, conIVA, tipo: 'demolicion', metros, plantas, escombros, plazo };
}

// IA - Generador inteligente
async function generarPresupuestoIA() {
  const descripcion = document.getElementById('descripcion-ia').value.trim();
  const iva = parseFloat(document.getElementById('iva-ia').value);

  if (!descripcion) { alert('Describe el proyecto'); return; }

  const btn = event.target;
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="display:inline-block;"></div> Analizando...';

  try {
    // Validar datos antes de calcular
    const validacion = validarDatos(descripcion);
    if (!validacion.valido) {
      document.getElementById('contenido-ia').innerHTML = `
        <div class="info" style="background: #fff3cd; border-left-color: #ffc107; margin: 0;">
          <strong>⚠️ Falta información:</strong><br><br>
          ${validacion.faltantes.map(d => '• ' + d).join('<br>')}
          <br><br>
          <em>Por favor, agrega estos datos a tu descripción y vuelve a intentar.</em>
        </div>
      `;
      document.getElementById('resultado-ia').classList.add('activo');
      btn.disabled = false;
      btn.innerHTML = 'Generar Presupuesto con IA';
      return;
    }

    // Simulación de análisis IA (en producción usaría Claude API)
    const presupuesto = analizarConReglas(descripcion, iva);

    let html = '<div class="desglose">';
    presupuesto.lineas.forEach(l => {
      html += `<div class="linea-presupuesto"><strong>${l.desc}</strong><span>${l.cant.toFixed(2)} ${l.unit}</span><span class="total-linea">€${l.subtotal.toFixed(2)}</span></div>`;
    });
    html += '</div>';

    html += `
      <div class="totales-resumen">
        <div class="total-item">
          <div class="total-label">Sin IVA</div>
          <div class="total-valor">€${presupuesto.sinIVA.toFixed(2)}</div>
        </div>
        <div class="total-item">
          <div class="total-label">IVA</div>
          <div class="total-valor">€${presupuesto.ivaImporte.toFixed(2)}</div>
        </div>
        <div class="total-item">
          <div class="total-label">Total</div>
          <div class="total-valor">€${presupuesto.conIVA.toFixed(2)}</div>
        </div>
      </div>
      <div style="margin-top: 20px; padding: 16px; background: #f0f0f0; border-radius: 4px; border-left: 3px solid var(--orange);">
        <strong>📋 Análisis IA:</strong><br>
        ${presupuesto.analisis}
      </div>
    `;

    document.getElementById('contenido-ia').innerHTML = html;
    document.getElementById('resultado-ia').classList.add('activo');
    window.presupuestoActual = { ...presupuesto, tipo: 'ia' };
  } catch (error) {
    document.getElementById('contenido-ia').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Generar Presupuesto con IA';
  }
}

// Validar que tenemos datos suficientes
function validarDatos(descripcion) {
  const desc = descripcion.toLowerCase();
  const faltantes = [];

  // Verificar si hay cantidad (metros, m², m³, etc.)
  const tieneNumero = /\d+/.test(descripcion);
  if (!tieneNumero) {
    faltantes.push('Cantidad: ¿Cuántos metros, m² o m³?');
  }

  // Verificar según tipo de trabajo
  if (desc.includes('excavación') || desc.includes('zanja')) {
    if (!desc.includes('profundidad') && !desc.match(/\d+\.?\d*\s*m\b/)) {
      faltantes.push('Profundidad de excavación (ej: 1.5m, 2m)');
    }
  }

  if (desc.includes('pavimento') || desc.includes('hormigón')) {
    if (!desc.includes('cm') && !desc.includes('espesor')) {
      faltantes.push('Espesor del pavimento (ej: 15cm, 20-25cm)');
    }
  }

  return {
    valido: faltantes.length === 0,
    faltantes: faltantes
  };
}

// Análisis con reglas (simulación de IA)
function analizarConReglas(descripcion, iva) {
  const desc = descripcion.toLowerCase();
  let lineas = [];
  let analisis = '';

  // Extraer cantidad (metros, m², m³, etc.)
  let cantidad = extraerNumero(descripcion);
  let unidad = 'm²';

  // Detectar unidad de medida
  if (desc.includes('m³') || desc.includes('volumen') || desc.includes('excavación')) unidad = 'm³';
  if (desc.includes('ml') || desc.includes('metro lineal')) unidad = 'ml';
  if (desc.includes('m²') || desc.includes('superficie')) unidad = 'm²';

  if (!cantidad) {
    // Si no encuentra cantidad, mostrar error
    lineas = [
      { cod: 'INFO', desc: 'Cantidad no especificada', cant: 1, unit: 'proyecto', precio: 0, subtotal: 0 }
    ];
    analisis = '⚠️ No encontré cantidad. Escribe: "250 m²", "500 m³", "150 metros", etc.';
    return { lineas, sinIVA: 0, ivaImporte: 0, conIVA: 0, analisis };
  }

  // Detección de palabras clave para EXCAVACIÓN
  if (desc.includes('excavación') || desc.includes('zanjas') || desc.includes('excavador') || desc.includes('cielo abierto')) {
    // Excavación de tierras
    const profundidad = extraerProfundidad(descripcion) || 1.5;
    const volumen = unidad === 'm³' ? cantidad : cantidad * profundidad;

    lineas = [
      { cod: 'E02BM020', desc: 'Excavación en zanjas, profundidad ' + profundidad + 'm', cant: cantidad, unit: unidad, precio: 8.50, subtotal: cantidad * 8.50 },
      { cod: 'G01C030', desc: 'Transporte y carga de tierras', cant: volumen, unit: 'm³', precio: 2.65, subtotal: volumen * 2.65 },
      { cod: 'E02AA010', desc: 'Limpieza de excavación', cant: cantidad, unit: unidad, precio: 1.25, subtotal: cantidad * 1.25 }
    ];
    analisis = `Excavación de ${cantidad}${unidad} a profundidad ${profundidad}m. Volumen estimado: ${volumen.toFixed(2)}m³. Incluye extracción, transporte y carga.`;
  }
  // Detección de PAVIMENTO
  else if (desc.includes('pavimento') || desc.includes('hormigón') || desc.includes('asfalto')) {
    const espesor = extraerEspesor(descripcion) || 0.20;
    const volumen = cantidad * espesor;

    lineas = [
      { cod: 'E01EPS060', desc: 'Demolición pavimento hormigón, espesor ' + (espesor*100).toFixed(0) + 'cm', cant: cantidad, unit: 'm²', precio: 12.45, subtotal: cantidad * 12.45 },
      { cod: 'G01C020', desc: 'Carga y transporte escombros', cant: volumen, unit: 'm³', precio: 19.97, subtotal: volumen * 19.97 }
    ];
    analisis = `Demolición de ${cantidad}m² de pavimento, espesor ${(espesor*100).toFixed(0)}cm. Volumen de escombros: ${volumen.toFixed(2)}m³. Incluso carga y transporte.`;
  }
  // Detección de DRENAJE/ZANJAS
  else if (desc.includes('zanja') || desc.includes('dren') || desc.includes('tubo') || desc.includes('PEAD')) {
    // Estimar metros lineales de zanja
    let ml = cantidad; // Asumir que la cantidad es en metros lineales
    if (desc.includes('m²') || unidad === 'm²') {
      ml = cantidad / 0.6; // Si es en m², convertir asumiendo 0.6m de ancho
    }

    lineas = [
      { cod: 'E02AE010', desc: 'Excavación zanja drenante', cant: ml, unit: 'ml', precio: 45.00, subtotal: ml * 45.00 },
      { cod: 'E04AS020', desc: 'Tubo PEAD drenante, Ø100mm', cant: ml, unit: 'ml', precio: 12.50, subtotal: ml * 12.50 },
      { cod: 'E04AT010', desc: 'Grava filtrante', cant: ml * 0.5, unit: 'm³', precio: 28.00, subtotal: (ml * 0.5) * 28.00 }
    ];
    analisis = `Zanja drenante de ${ml.toFixed(0)}ml. Incluye excavación, tubo PEAD Ø100mm, grava filtrante y relleno.`;
  }
  // Detección de palabras clave para DEMOLICIÓN (edificios)
  else if (desc.includes('demolición') || desc.includes('derribo') || desc.includes('derribar')) {
    const plantas = extraerNumero(descripcion, /(\d+)\s*plantas?/) || 1;

    const cubierta = metros * 1.1;
    const tabiques = (metros / plantas) * 1.5 * plantas;
    const pisos = metros;
    const muros = (Math.sqrt(metros) * 4) * (3 * plantas);
    const escombros = metros * (5 + plantas) / 10;

    lineas = [
      { cod: 'E01ECC030', desc: 'Demolición cubierta', cant: cubierta, unit: 'm²', precio: 7.49, subtotal: cubierta * 7.49 },
      { cod: 'E01EFBF050', desc: 'Demolición tabiques', cant: tabiques, unit: 'm²', precio: 4.86, subtotal: tabiques * 4.86 },
      { cod: 'E01EPP030', desc: 'Demolición pisos', cant: pisos, unit: 'm²', precio: 5.82, subtotal: pisos * 5.82 },
      { cod: 'E01EFBF140', desc: 'Demolición muros', cant: muros, unit: 'm²', precio: 12.20, subtotal: muros * 12.20 },
      { cod: 'E02AA010', desc: 'Limpieza terreno', cant: metros, unit: 'm²', precio: 4.21, subtotal: metros * 4.21 },
      { cod: 'G01C030', desc: 'Carga y descarga camión', cant: escombros, unit: 'm³', precio: 2.65, subtotal: escombros * 2.65 }
    ];
    analisis = `Demolición de ${metros}m² con ${plantas} plantas. Incluye estructura completa, retirada de escombros (${escombros.toFixed(0)}m³) y limpieza. Plazo: ${Math.ceil(metros / 40)}-${Math.ceil(metros / 25)} días.`;
  } else if (desc.includes('desbroce') || desc.includes('limpieza') || desc.includes('limpiar')) {
    const tipo = desc.includes('tala') || desc.includes('árboles') ? 'completo' : 'basico';
    const volumen = metros * 0.15;

    lineas = tipo === 'basico'
      ? [
          { cod: 'E02AM010', desc: 'Desbroce con máquina', cant: metros, unit: 'm²', precio: 0.68, subtotal: metros * 0.68 },
          { cod: 'E02AA020', desc: 'Retirada tierra vegetal', cant: metros, unit: 'm²', precio: 5.13, subtotal: metros * 5.13 },
          { cod: 'G01C030', desc: 'Carga y descarga camión', cant: volumen, unit: 'm³', precio: 2.65, subtotal: volumen * 2.65 }
        ]
      : [
          { cod: 'E02AM010', desc: 'Desbroce con máquina', cant: metros, unit: 'm²', precio: 0.68, subtotal: metros * 0.68 },
          { cod: 'E02AM030', desc: 'Tala y desrame árboles', cant: metros, unit: 'm²', precio: 3.54, subtotal: metros * 3.54 },
          { cod: 'E02AA020', desc: 'Retirada tierra vegetal', cant: metros, unit: 'm²', precio: 5.13, subtotal: metros * 5.13 },
          { cod: 'G01C030', desc: 'Carga y descarga camión', cant: volumen, unit: 'm³', precio: 2.65, subtotal: volumen * 2.65 }
        ];
    analisis = `Desbroce de ${metros}m² con retirada de ${volumen.toFixed(0)}m³ de tierra. ${tipo === 'completo' ? 'Incluye tala de árboles.' : ''} Plazo: ${Math.ceil(metros / 200)}-${Math.ceil(metros / 100)} días.`;
  } else {
    // Si tiene metros pero tipo ambiguo, usar precios simples (demolición básica)
    const volumen = metros * 0.25;  // Estimación de escombros

    lineas = [
      { cod: 'E01EPS050', desc: 'Demolición/Reforma', cant: metros, unit: 'm²', precio: 16.51, subtotal: metros * 16.51 },
      { cod: 'E01AL020', desc: 'Limpieza y retirada', cant: metros, unit: 'm²', precio: 10.62, subtotal: metros * 10.62 },
      { cod: 'G01C030', desc: 'Carga y descarga', cant: volumen, unit: 'm³', precio: 2.65, subtotal: volumen * 2.65 }
    ];
    analisis = `Presupuesto estimado para ${metros}m² de obra. Para un cálculo más preciso, especifica: demolición, desbroce, reforma, etc.`;
  }

  const sinIVA = lineas.reduce((sum, l) => sum + l.subtotal, 0);
  const ivaImporte = sinIVA * (iva / 100);
  const conIVA = sinIVA + ivaImporte;

  return { lineas, sinIVA, ivaImporte, conIVA, analisis };
}

function extraerNumero(texto, regex) {
  // Buscar todos los números en el texto
  const numeros = texto.match(/\d+\.?\d*/g);
  if (!numeros || numeros.length === 0) return null;

  // Retornar el número más grande (probablemente sea la cantidad principal)
  let maxNum = 0;
  for (let num of numeros) {
    const n = parseFloat(num);
    if (n > maxNum && n < 1000000) {  // Evitar números absurdos
      maxNum = n;
    }
  }
  return maxNum > 0 ? maxNum : null;
}

function extraerProfundidad(texto) {
  // Buscar "profundidad X m" o "X.X m"
  const match = texto.match(/profundidad\s*de?\s*(\d+\.?\d*)\s*m/i);
  if (match) return parseFloat(match[1]);

  // Buscar números decimales (típico para profundidades)
  const decimales = texto.match(/\d+\.\d+/g);
  if (decimales && decimales.length > 0) {
    return parseFloat(decimales[0]);
  }
  return null;
}

function extraerEspesor(texto) {
  // Buscar "espesor X cm" o "X-Y cm"
  const match = texto.match(/espesor\s*(?:de\s+)?(\d+)\s*(?:a\s+)?(\d+)?\s*cm/i);
  if (match) {
    const min = parseInt(match[1]);
    const max = match[2] ? parseInt(match[2]) : min;
    return ((min + max) / 2) / 100; // Convertir cm a m
  }

  // Buscar solo números con "cm"
  const cmMatch = texto.match(/(\d+)\s*cm/i);
  if (cmMatch) {
    return parseInt(cmMatch[1]) / 100;
  }

  return null;
}

// Exportar
function exportarJSON(tab) {
  const data = window.presupuestoActual;
  const json = {
    titulo: tab.charAt(0).toUpperCase() + tab.slice(1),
    lineas: data.lineas.map(l => ({ codigo: l.cod, descripcion: l.desc, cantidad: l.cant, unidad: l.unit, precio: l.precio, subtotal: l.cant * l.precio })),
    totales: { sin_iva: data.sinIVA, iva_importe: data.ivaImporte, con_iva: data.conIVA }
  };
  const blob = new Blob([JSON.stringify(json, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-${tab}.json`;
  a.click();
}

function exportarCSV(tab) {
  const data = window.presupuestoActual;
  let csv = 'Código,Concepto,Cantidad,Unidad,Precio,Subtotal\n';
  data.lineas.forEach(l => {
    csv += `${l.cod},"${l.desc}",${l.cant.toFixed(2)},${l.unit},${l.precio},${(l.cant * l.precio).toFixed(2)}\n`;
  });
  csv += `\n,TOTAL SIN IVA,,,${data.sinIVA.toFixed(2)}\n,IVA,,,${data.ivaImporte.toFixed(2)}\n,TOTAL CON IVA,,,${data.conIVA.toFixed(2)}`;
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-${tab}.csv`;
  a.click();
}
