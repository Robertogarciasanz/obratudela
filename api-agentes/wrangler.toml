# Configuración del Worker de la API para agentes de IA (ver LEEME.md)
name = "obratudela-api-agentes"
main = "worker.js"
compatibility_date = "2026-11-01"

# Dirección actual de la API: obratudela-api-agentes.excavacionesart.workers.dev
# (tiene que quedarse en true aunque se añada una dirección propia)
workers_dev = true

# Dirección propia: api.cenital.org (cenital.org está en esta misma cuenta).
# api.obratudela.com queda PENDIENTE: obratudela.com está en otra cuenta de
# Cloudflare. Cuando se mueva a esta, añadir aquí:
#   { pattern = "api.obratudela.com", custom_domain = true }
routes = [
  { pattern = "api.cenital.org", custom_domain = true }
]

[vars]
# Interruptor general. "no" = no cobra ni sirve datos de pago.
PAGOS_ACTIVOS = "si"

# Dirección de cobro (wallet propia, empieza por 0x). NO se escribe aquí,
# porque esta carpeta podría acabar publicada en la web y cualquiera vería el
# saldo de la wallet. Se guarda aparte:
#   - en el ordenador: archivo api-agentes/.dev.vars (Git lo ignora)
#   - en Cloudflare:   npx wrangler secret put COBRAR_A
# Si no está puesta, el cobro queda apagado.

# Red de pago:
#   "eip155:84532" = Base Sepolia, red de PRUEBAS (dinero ficticio)
#   "eip155:8453"  = Base, red REAL (dinero de verdad)
# En uso: red REAL desde el 25/11/2026 (el dueño lo consultó con su gestor).
RED = "eip155:8453"

# Facilitador que comprueba y liquida los pagos. No puede quedarse con el
# dinero: el agente firma un pago exacto a COBRAR_A y él solo lo ejecuta.
#   - PayAI (en uso): red de pruebas y real, sin clave, gratis hasta 10.000
#     cobros al mes (docs.payai.network/x402/facilitators/pricing).
#   - Coinbase (CDP): "https://api.cdp.coinbase.com/platform/v2/x402", con los
#     secretos CDP_API_KEY_ID y CDP_API_KEY_SECRET. Su clave devolvía 401.
#   - Solo pruebas, sin clave: "https://x402.org/facilitator"
FACILITADOR = "https://facilitator.payai.network"

# Precios en dólares (USDC)
PRECIO_CONSULTA = "0.01"
PRECIO_OFERTA = "0.50"
# Bici en 3D de cenital.org
PRECIO_PIEZA = "0.01"
PRECIO_IMPRESION = "0.05"
URL_BICI = "https://cenital.org/bici/datos.json"
# Parcelas del Catastro
PRECIO_PARCELA = "0.05"

# De dónde lee los precios (regenerar con: python scripts/generar-base-ligera.py)
URL_DATOS = "https://www.obratudela.com/data/base-precios-ligero.json"
