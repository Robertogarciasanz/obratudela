<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Presupuesto Demolición Edificios</title>
  <meta name="description" content="Calcula presupuesto para demolición de edificios en tiempo real">
  <link rel="canonical" href="https://www.obratudela.com/calculadora-demolicion.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #ff6b00; --text: #222; --bg: #f9f9f9; --border: #ddd; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: var(--orange); margin-bottom: 10px; text-align: center; font-size: 28px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,107,0,0.1); }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .input-group { display: flex; gap: 12px; }
    .input-group input { flex: 1; }
    .unit { display: flex; align-items: center; padding: 0 12px; background: #f0f0f0; border-radius: 4px; font-weight: 600; color: #666; white-space: nowrap; }
    button { background: var(--orange); color: white; border: none; padding: 14px 32px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    button:hover { background: #e05e00; }
    .resultado { margin-top: 40px; padding: 24px; background: #f9f9f9; border-left: 4px solid var(--orange); border-radius: 4px; display: none; }
    .resultado.activo { display: block; }
    .precio-total { font-size: 28px; font-weight: 700; color: var(--orange); margin: 16px 0; }
    .desglose { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
    .linea-presupuesto { display: grid; grid-template-columns: 2fr 1.5fr 1.2fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .linea-presupuesto:last-child { border-bottom: none; }
    .total-linea { text-align: right; font-weight: 600; color: var(--orange); }
    .info { background: #e8f4f8; border-left: 4px solid #0096d6; padding: 12px; border-radius: 4px; font-size: 13px; margin-top: 12px; color: #333; }
    .botones-export { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn-secondary { background: #666; flex: 1; font-size: 13px; padding: 10px; min-width: 150px; }
    .btn-secondary:hover { background: #555; }
    h2 { font-size: 16px; margin-bottom: 12px; color: var(--orange); }
    #estado { background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; }
    @media (max-width: 600px) { .input-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <h1>🏗️ Calculadora Demolición Edificios</h1>
  <p class="subtitle">Casa unifamiliar | Edificio pequeño | Personalizado</p>

  <div id="estado">⏳ Cargando precios de la base de datos...</div>

  <div class="input-row">
    <div class="form-group">
      <label for="metros">Superficie total a demoler</label>
      <div class="input-group">
        <input type="number" id="metros" placeholder="Ej: 200, 500, 1000..." min="1" max="100000" value="">
        <div class="unit">m²</div>
      </div>
    </div>
    <div class="form-group">
      <label for="plantas">Número de plantas</label>
      <input type="number" id="plantas" placeholder="1, 2, 3..." min="1" max="10" value="2">
    </div>
  </div>

  <div class="form-group">
    <label for="tipo">Tipo de construcción</label>
    <select id="tipo">
      <option value="mixto">Mixto (ladrillos + hormigón)</option>
      <option value="hormigon">Hormigón armado</option>
      <option value="ladrillo">Ladrillo visto</option>
    </select>
  </div>

  <div class="form-group">
    <label for="iva">IVA</label>
    <select id="iva">
      <option value="21">21% (España estándar)</option>
      <option value="10">10% (Reducido)</option>
      <option value="0">0% (Sin IVA)</option>
    </select>
  </div>

  <button onclick="calcular()">Calcular Presupuesto</button>

  <div class="resultado" id="resultado">
    <h2>📊 Presupuesto Demolición</h2>
    <div class="desglose" id="desglose"></div>

    <div style="text-align: right; margin-top: 20px;">
      <div style="font-size: 13px; color: #666; margin-bottom: 8px;">Total sin IVA</div>
      <div id="totalSinIVA" style="font-size: 20px; font-weight: 600; margin-bottom: 16px;"></div>
      <div style="font-size: 13px; color: #666; margin-bottom: 8px;">IVA</div>
      <div id="importeIVA" style="font-size: 16px; font-weight: 600; margin-bottom: 16px;"></div>
      <div class="precio-total">Total con IVA: <span id="totalConIVA">€0,00</span></div>
    </div>

    <div id="notas" style="margin-top: 20px; padding: 16px; background: #f0f0f0; border-radius: 4px; font-size: 13px; color: #333; border-left: 3px solid var(--orange);"></div>

    <div class="botones-export">
      <button class="btn-secondary" onclick="exportarJSON()">📥 Descargar JSON</button>
      <button class="btn-secondary" onclick="exportarCSV()">📊 Descargar CSV</button>
      <button class="btn-secondary" onclick="imprimirPresupuesto()">🖨️ Imprimir</button>
    </div>
  </div>
</div>

<script>
const CODIGOS = {
  mixto: {
    cubierta: 'E01ECC030',
    tabiques: 'E01EFBF050',
    pisos: 'E01EPP030',
    muros: 'E01EFBF140',
    limpieza: 'E02AA010',
    carga: 'G01C030'
  }
};

let precios = {};

async function cargarPrecios() {
  try {
    const response = await fetch('precios.json');
    const data = await response.json();
    const items = data.items || [];

    const codigos = ['E01ECC030', 'E01EFBF050', 'E01EPP030', 'E01EFBF140', 'E02AA010', 'G01C030'];
    for (const codigo of codigos) {
      const item = items.find(i => i.cod === codigo);
      if (item) {
        precios[codigo] = { desc: item.res, precio: item.precio, unidad: item.uni };
      }
    }
    document.getElementById('estado').innerHTML = '✅ Base de datos cargada';
  } catch (error) {
    document.getElementById('estado').innerHTML = '⚠️ Usando precios por defecto';
    precios = {
      'E01ECC030': { desc: 'Demolición cubierta', precio: 7.49, unidad: 'm2' },
      'E01EFBF050': { desc: 'Demolición tabiques', precio: 4.86, unidad: 'm2' },
      'E01EPP030': { desc: 'Demolición solados', precio: 5.82, unidad: 'm2' },
      'E01EFBF140': { desc: 'Demolición muros carga', precio: 12.2, unidad: 'm2' },
      'E02AA010': { desc: 'Limpieza terreno', precio: 4.21, unidad: 'm2' },
      'G01C030': { desc: 'Carga escombros', precio: 2.65, unidad: 'm3' }
    };
  }
}

function calcular() {
  if (!precios['E01ECC030']) { alert('Cargando precios...'); return; }

  const metros = parseFloat(document.getElementById('metros').value) || 0;
  const plantas = parseInt(document.getElementById('plantas').value) || 1;
  const ivaPorc = parseFloat(document.getElementById('iva').value);

  if (metros <= 0) { alert('Ingresa metros válidos'); return; }

  // Estimaciones basadas en metros y plantas
  const cubierta = metros * 1.1; // +10% por inclinación
  const tabiques = (metros / plantas) * 1.5 * plantas; // divisiones internas
  const pisos = metros;
  const muros = (Math.sqrt(metros) * 4) * (3 * plantas); // perímetro × altura
  const escombros = metros * (5 + plantas) / 10; // volumen estimado

  const lineas = [
    { cod: 'E01ECC030', desc: precios['E01ECC030'].desc, cant: cubierta, unit: 'm2', precio: 7.49 },
    { cod: 'E01EFBF050', desc: precios['E01EFBF050'].desc, cant: tabiques, unit: 'm2', precio: 4.86 },
    { cod: 'E01EPP030', desc: precios['E01EPP030'].desc, cant: pisos, unit: 'm2', precio: 5.82 },
    { cod: 'E01EFBF140', desc: precios['E01EFBF140'].desc, cant: muros, unit: 'm2', precio: 12.2 },
    { cod: 'E02AA010', desc: precios['E02AA010'].desc, cant: metros, unit: 'm2', precio: 4.21 },
    { cod: 'G01C030', desc: precios['G01C030'].desc, cant: escombros, unit: 'm3', precio: 2.65 }
  ];

  let html = '';
  const sinIVA = lineas.reduce((sum, l) => {
    const subtotal = l.cant * l.precio;
    html += `<div class="linea-presupuesto">
      <strong>${l.desc} (${l.cod})</strong>
      <span>${l.cant.toFixed(2)} ${l.unit} × €${l.precio.toFixed(2)}</span>
      <span class="total-linea">€${subtotal.toFixed(2)}</span>
    </div>`;
    return sum + subtotal;
  }, 0);

  const importeIVA = sinIVA * (ivaPorc / 100);
  const conIVA = sinIVA + importeIVA;

  document.getElementById('desglose').innerHTML = html;
  document.getElementById('totalSinIVA').textContent = `€${sinIVA.toFixed(2)}`;
  document.getElementById('importeIVA').textContent = `€${importeIVA.toFixed(2)} (${ivaPorc}%)`;
  document.getElementById('totalConIVA').textContent = `€${conIVA.toFixed(2)}`;
  document.getElementById('notas').innerHTML = `<strong>📋 Estimaciones:</strong><br>Escombros: ${escombros.toFixed(0)} m³<br>Plazo: ${Math.ceil(metros / 50)}-${Math.ceil(metros / 30)} días<br>Maquinaria: Excavadora + Pala + Camión volquete`;

  window.presupuestoData = { metros, plantas, lineas, sinIVA, importeIVA, conIVA, escombros };
  document.getElementById('resultado').classList.add('activo');
}

function exportarJSON() {
  const data = window.presupuestoData;
  const json = {
    titulo: 'Demolición Edificio',
    metros: data.metros,
    plantas: data.plantas,
    lineas: data.lineas.map(l => ({ codigo: l.cod, descripcion: l.desc, cantidad: l.cant, unidad: l.unit, precio: l.precio, subtotal: l.cant * l.precio })),
    totales: { sin_iva: data.sinIVA, iva: 21, iva_importe: data.importeIVA, con_iva: data.conIVA }
  };
  const blob = new Blob([JSON.stringify(json, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-demolicion-${data.metros}m2.json`;
  a.click();
}

function exportarCSV() {
  const data = window.presupuestoData;
  let csv = 'Código,Concepto,Cantidad,Unidad,Precio Unitario,Subtotal\n';
  data.lineas.forEach(l => {
    csv += `${l.cod},"${l.desc}",${l.cant.toFixed(2)},${l.unit},${l.precio},${(l.cant * l.precio).toFixed(2)}\n`;
  });
  csv += `\n,TOTAL SIN IVA,,,${data.sinIVA.toFixed(2)}\n,IVA 21%,,,${data.importeIVA.toFixed(2)}\n,TOTAL CON IVA,,,${data.conIVA.toFixed(2)}`;

  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `presupuesto-demolicion-${data.metros}m2.csv`;
  a.click();
}

function imprimirPresupuesto() { window.print(); }

window.addEventListener('DOMContentLoaded', async () => { await cargarPrecios(); });
</script>
</body>
</html>
