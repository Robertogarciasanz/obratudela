            /**
             * Extrae múltiples dimensiones (largo, ancho, alto, m2, etc.) de una consulta.
             * @param {string} query - El texto del usuario.
             * @returns {{dimensions: object, cleanedQuery: string}}
             */
            function parseQueryForDimensions(query) {
                const dimensions = {};
                let cleanedQuery = query;
                const regex = /(\d+[\.,]?\d*)\s*(m2|m²|m3|m³|ml|metros|m|cm|largo|ancho|alto|profundo|espesor)/gi;
                let match;

                while ((match = regex.exec(query)) !== null) {
                    const value = parseFloat(match[1].replace(',', '.'));
                    const unit = match[2].toLowerCase();

                    if (unit.includes('largo')) dimensions.largo = value;
                    else if (unit.includes('ancho')) dimensions.ancho = value;
                    else if (unit.includes('alto') || unit.includes('profundo') || unit.includes('espesor')) dimensions.alto = value;
                    else if (unit.includes('m2') || unit.includes('m²')) dimensions.area = value;
                    else if (unit.includes('m3') || unit.includes('m³')) dimensions.volumen = value;
                    else if (unit === 'cm') {
                        dimensions.alto = value / 100; // Convertir cm a metros automáticamente
                    }
                    else if (unit.includes('ml') || unit.includes('metros') || unit === 'm') {
                        if (!dimensions.largo) dimensions.largo = value;
                        else if (!dimensions.ancho) dimensions.ancho = value;
                        else if (!dimensions.alto) dimensions.alto = value;
                    }
                    cleanedQuery = cleanedQuery.replace(match[0], ' ');
                }

                if (dimensions.volumen) lastParsedQuantity = dimensions.volumen;
                else if (dimensions.area) lastParsedQuantity = dimensions.area;
                else if (dimensions.largo && dimensions.ancho && dimensions.alto) lastParsedQuantity = dimensions.largo * dimensions.ancho * dimensions.alto;
                else if (dimensions.largo && dimensions.ancho) lastParsedQuantity = dimensions.largo * dimensions.ancho;
                else if (dimensions.largo) lastParsedQuantity = dimensions.largo;

                return { dimensions, cleanedQuery: cleanedQuery.replace(/\s+/g, ' ').trim() || query };
            }

            /**
             * Limpia y convierte una entrada de texto a metros.
             * @param {string} entradaTexto - El texto del usuario (ej: "25 cm", "10m").
             * @returns {number|null} - El valor en metros o null si no es válido.
             */
            function normalizarMedida(entradaTexto) {
                if (!entradaTexto) return null;
                let texto = entradaTexto.toString().toLowerCase().trim();

                let valorNumerico = parseFloat(texto.replace(',', '.'));
                if (isNaN(valorNumerico)) return null;

                if (texto.includes('cm')) {
                    return valorNumerico / 100;
                }

                return valorNumerico;
            }

                        <div class="result-item">
                            <div class="result-item-info">
                                <div class="result-item-res">${item.res}</div>
                                <div class="result-item-meta">${item.cod} · ${item.precio.toFixed(2)} €/${item.uni}</div>
                            </div>
                            <button class="btn-add-item" title="Añadir al presupuesto" onclick="window.app.addItemToBudget('${item.cod}')">+</button>
                        </div>
                    `;
                }).join('');

                const resultsHtml = `
                    <div class="search-results">
                        <h3>He encontrado estas partidas, ¿cuál quieres añadir?</h3>
                        ${itemsHtml}
                    </div>
                `;
                addMessage(resultsHtml);
            }

            function generateBudget() {
                saveBudget();

                let total = 0;
                const tablaConBorrado = presupuesto.map(item => {
                    const importe = item.qty * item.precio;
                    total += importe;
                    return `
                        <tr>
                            <td>${item.res}</td>
                            <td style="text-align:right;">
                                <input type="number" value="${item.qty}" onchange="window.app.updateItemQuantity('${item.cod}', this.value)" style="width: 60px; text-align: right; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px; border-radius: 4px; font-size: 13px;">
                            </td>
                            <td>${item.uni}</td>
                            <td style="text-align:right;">${item.precio.toFixed(2)} €</td>
                            <td style="text-align:right; font-weight:bold;">${importe.toFixed(2)} €</td>
                            <td style="text-align:center;">
                                <button onclick="window.app.removeItem('${item.cod}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;" title="Eliminar partida">🗑️</button>
                            </td>
                        </tr>
                    `;
                }).join('');

                const iva = total * 0.21;
                const granTotal = total + iva;

                if (presupuesto.length === 0) {
                    // Si no hay partidas, eliminar el presupuesto
                    let existingBudget = document.getElementById('presupuestoResultado');
                    if (existingBudget) {
                        existingBudget.parentElement.parentElement.remove();
                    }
                    return;
                }

                const resultadoHtml = `
                    <div id="presupuestoResultado">
                        <h3>✅ Presupuesto Estimado</h3>
                        <table id="tablaConceptos">
                            <thead>
                                <tr><th>Concepto</th><th>Cant.</th><th>Ud.</th><th>Precio</th><th>Importe</th><th></th></tr>
                            </thead>
                            <tbody>${tablaConBorrado}</tbody>
                        </table>
                        <table id="tablaTotales" style="width: 280px; float: right;">
                            <tr class="total-row"><td>Subtotal</td><td style="text-align:right;">${total.toFixed(2)} €</td></tr>
                            <tr class="total-row"><td>IVA (21%)</td><td style="text-align:right;">${iva.toFixed(2)} €</td></tr>
                            <tr class="total-row grand-total"><td>TOTAL</td><td style="text-align:right; font-size: 16px;">${granTotal.toFixed(2)} €</td></tr>
                        </table>
                        <div style="clear:both;"></div>
                        <p style="font-size:11px; color:var(--muted); margin-top:15px;">*Este es un presupuesto orientativo. Los precios pueden variar. Para un presupuesto cerrado, contacta con nosotros.</p>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;">
                            <button class="btn-print" onclick="window.app.exportarExcel()" style="background:var(--green);color:#fff;">📊 Exportar Excel</button>
                            <button class="btn-print" onclick="window.app.exportarBC3()" style="background:var(--orange);color:#000;">📁 Exportar BC3</button>
                            <button class="btn-print" onclick="window.app.generarYMostrarPresupuesto('share')" style="background:var(--blue);color:#fff;">📲 Compartir</button>
                            <button class="btn-print" onclick="window.app.vaciarPresupuesto()" style="background:var(--user-bg);color:var(--muted);">🗑️ Vaciar</button>
                            <button class="btn-print" onclick="window.app.generarYMostrarPresupuesto('print')">🖨️ Imprimir</button>
                        </div>
                    </div>
                `;

                addMessage(resultadoHtml);
            }

            function handleUserInput() {
                const text = userInput.value.trim();
                if (!text) return;

                addMessage(text, 'user');
                userInput.value = '';
                sendButton.disabled = true;

                setTimeout(() => {
                    if (!fuse) {
                        streamMessage("<p>La base de datos aún no está lista. Por favor, espera un momento.</p>");
                        sendButton.disabled = false;
                        return;
                    }

                    if (conversationState.isWaitingForData) {
                        const dimensionFaltante = conversationState.requiredDimensions[0];
                        const valor = normalizarMedida(text);

                        if (dimensionFaltante && valor !== null) {
                            conversationState.collectedDimensions[dimensionFaltante] = valor;
                            conversationState.requiredDimensions.shift();
                        }

                        if (conversationState.requiredDimensions.length > 0) {
                            askForNextDimension();
                        } else {
                            conversationState.isWaitingForData = false;
                            const { largo, ancho, alto } = conversationState.collectedDimensions;
                            if (largo && ancho && alto) lastParsedQuantity = largo * ancho * alto;
                            else if (largo && ancho) lastParsedQuantity = largo * ancho;
                            else if (largo) lastParsedQuantity = largo;
                            searchAndDisplay(conversationState.cleanedQuery);
                        }
                    } else {
                        resetConversationState();
                        const { dimensions, cleanedQuery } = parseQueryForDimensions(text);

                        const required = ['largo', 'ancho', 'alto'];
                        conversationState.requiredDimensions = required.filter(d => !dimensions[d]);
                        conversationState.collectedDimensions = dimensions;
                        conversationState.cleanedQuery = cleanedQuery;

                        if (conversationState.requiredDimensions.length > 0 && Object.keys(dimensions).length > 0) {
                            conversationState.isWaitingForData = true;
                            askForNextDimension();
                        } else {
                            searchAndDisplay(cleanedQuery);
                        }
                    }

                    sendButton.disabled = false;
                }, 400);
            }

            sendButton.addEventListener('click', handleUserInput);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleUserInput();
                }
            });

            // --- Función para que el área de texto crezca automáticamente ---
            userInput.addEventListener('input', () => {
                // Resetea la altura para que pueda encogerse si se borra texto
                userInput.style.height = 'auto';
                // Ajusta la altura al contenido, respetando el max-height del CSS
                const scrollHeight = userInput.scrollHeight;
                userInput.style.height = `${scrollHeight}px`;
            });

            function askForNextDimension() {
                const dimension = conversationState.requiredDimensions[0];
                let question = '';
                switch (dimension) {
                    case 'largo': question = '¿Qué longitud tiene? (en metros)'; break;
                    case 'ancho': question = '¿Y de ancho? (en metros)'; break;
                    case 'alto': question = '¿Qué espesor o profundidad debe tener? (en metros o cm)'; break;
                    default:
                        searchAndDisplay(conversationState.cleanedQuery);
                        return;
                }
                streamMessage(`<p>${question}</p>`);
            }

            function saveBudget() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(presupuesto));
                } catch (e) {
                    console.warn("No se pudo guardar el presupuesto en localStorage.", e);
                }
            }

            function nuevaConsulta() {
                if (chatHistory.length === 0 && presupuesto.length === 0) return;

                if (confirm('¿Seguro que quieres borrar la conversación y el presupuesto actual?')) {
                    // Limpiar estado en memoria
                    presupuesto = [];
                    chatHistory = [];
                    resetConversationState();

                    // Limpiar almacenamiento local
                    localStorage.removeItem(STORAGE_KEY);
                    localStorage.removeItem(CHAT_STORAGE_KEY);

                    // Limpiar la interfaz y reiniciar
                    chatMessages.innerHTML = '';
                    streamMessage("<p>¡Hola! Soy tu asistente de presupuestos.</p><p>Describe lo que necesitas y te ayudaré a encontrar las partidas. Por ejemplo: <code>20 m2 de muro de ladrillo perforado</code>.</p>");
                }
            }

            function saveChatHistory() {
                try {
                    localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory));
                } catch (e) {
                    console.warn("No se pudo guardar el historial del chat.", e);
                }
            }

            function loadChatHistory() {
                try {
                    const saved = localStorage.getItem(CHAT_STORAGE_KEY);
                    if (saved) {
                        chatHistory = JSON.parse(saved);
                        // Al cargar, no guardamos de nuevo en el historial
                        chatHistory.forEach(msg => {
                            const msgDiv = document.createElement('div');
                            msgDiv.className = `message ${msg.sender}`;
                            msgDiv.innerHTML = `
                                <div class="avatar">${msg.sender === 'ai' ? '🤖' : '👤'}</div>
                                <div class="message-content">${msg.text}</div>
                            `;
                            chatMessages.appendChild(msgDiv);
                        });
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                } catch (e) { console.error("Error al cargar historial del chat.", e); }
            }

            function encodeBudgetForUrl(budget) {
                if (!budget || budget.length === 0) return '';
                const items = budget.map(item => `${item.cod}:${item.qty}`);
                return btoa(items.join(','));
            }

            function loadBudget() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const loadedBudget = JSON.parse(saved);
                        // Validar integridad: verificar que las partidas existan en la BD
                        presupuesto = loadedBudget.filter(item => {
                            const exists = allItems.find(i => i.cod === item.cod);
                            if (!exists) {
                                console.warn(`Partida ${item.cod} ya no existe en la BD, se elimina del presupuesto.`);
                            }
                            return exists;
                        });

                        // Si hubo cambios, guardar el presupuesto limpio
                        if (presupuesto.length !== loadedBudget.length) {
                            saveBudget();
                        }
                    }

                    if (presupuesto.length > 0) generateBudget();
                } catch (e) {
                    console.error("Error al cargar el presupuesto desde localStorage.", e);
                    localStorage.removeItem(STORAGE_KEY);
                    presupuesto = [];
                }
            }

            nuevaConsultaBtn.addEventListener('click', nuevaConsulta);

            window.app.generarYMostrarPresupuesto = async (action) => {
                if (presupuesto.length === 0) {
                    alert("El presupuesto está vacío. Añade alguna partida primero.");
                    return;
                }

                if (action === 'print') {
                    const w = window.open('', '_blank', 'width=800,height=900,scrollbars=yes,resizable=yes');
                    if (!w) {
                        alert('Por favor, permite las ventanas emergentes para ver el presupuesto.');
                        return;
                    }
                    w.document.write('<p style="font-family:sans-serif; padding:20px;">Generando presupuesto...</p>');
                    try {
                        await new Promise(r => setTimeout(r, 150));
                        const presupuestoHTML = generarHtmlParaImprimir();
                        w.document.open();
                        w.document.write(presupuestoHTML);
                        w.document.close();
                        w.print();
                    } catch (error) {
                        console.error("Error al imprimir:", error);
                        w.document.write('<p style="color:red;">Error al generar el documento.</p>');
                        w.document.close();
                    }
                } else if (action === 'share') {
                    const { texto, total } = generarTextoPlanoPresupuesto();
                    const shareData = {
                        title: 'Presupuesto Estimado - ObraTudela',
                        text: texto,
                        url: 'https://www.obratudela.com/calculadora-presupuestos.html'
                    };

                    if (navigator.share) {
                        try {
                            await navigator.share(shareData);
                        } catch (err) {
                            console.warn("Error al compartir:", err);
                        }
                    } else {
                        try {
                            await navigator.clipboard.writeText(texto);
                            alert("Presupuesto copiado al portapapeles.");
                        } catch (err) {
                            console.error("Error al copiar:", err);
                            alert("No se pudo copiar el presupuesto.");
                        }
                    }
                }
            };

            function generarHtmlParaImprimir() {
                const tablaConceptos = document.getElementById('tablaConceptos')?.outerHTML || '';
                const tablaTotales = document.getElementById('tablaTotales')?.outerHTML || '';

                if (!tablaConceptos) throw new Error("No hay tabla de presupuestos.");

                const printStyles = `
                    body { font-family: 'Open Sans', Arial, sans-serif; font-size: 12px; margin: 30px; color: #1f2937; line-height: 1.5; }
                    h1 { font-size: 22px; margin: 0; color: #ff6b00; text-transform: uppercase; }
                    h3 { font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
                    .header-container { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #ff6b00; padding-bottom: 15px; margin-bottom: 20px; }
                    .company-info { font-size: 12px; color: #4b5563; }
                    .company-info strong { color: #111827; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                    th { background-color: #f3f4f6; color: #374151; padding: 8px; text-align: left; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #e5e7eb; }
                    td { padding: 8px; border-bottom: 1px solid #e5e7eb; }
                    input { border: none; background: transparent; font-weight: bold; width: auto; }
                    button { display: none !important; }
                    #tablaTotales { width: 280px; float: right; margin-top: 10px; }
                    #tablaTotales td { border-bottom: 1px solid #e5e7eb; }
                    .total-row td { font-weight: bold; }
                    .grand-total td { font-size: 16px; color: #ff6b00; border-top: 2px solid #ff6b00; padding-top: 8px; }
                    .footer-notes { font-size: 11px; color: #6b7280; margin-top: 40px; clear: both; border-top: 1px solid #e5e7eb; padding-top: 10px; }
                    @media print {
                        .no-print { display: none; }
                        body { margin: 0; }
                    }
                `;

                return `
                    <!DOCTYPE html>
                    <html lang="es">
                        <head>
                            <meta charset="UTF-8">
                            <title>Presupuesto Estimado — ObraTudela</title>
                            <style>${printStyles}</style>
                        </head>
                        <body>
                            <div class="header-container">
                                <div>
                                    <h1>OBRA TUDELA</h1>
                                    <p style="margin:3px 0 0 0; color:#6b7280;">Excavaciones y Servicios Arturo S.L.</p>
                                </div>
                                <div class="company-info" style="text-align:right;">
                                    <div><strong>Teléfono:</strong> 607 444 903</div>
                                    <div><strong>Email:</strong> excavacionesart@gmail.com</div>
                                    <div><strong>Fecha:</strong> ${new Date().toLocaleDateString('es-ES')}</div>
                                </div>
                            </div>
                            <h3>Detalle de Partidas</h3>
                            ${tablaConceptos}
                            ${tablaTotales}
                            <div class="footer-notes">
                                * Este documento es una estimación orientativa generada por la herramienta de asistencia técnica de ObraTudela. Precios sujetos a verificación sobre el terreno.
                            </div>
                        </body>
                    </html>
                `;
            }

            function generarTextoPlanoPresupuesto() {
                let texto = "PRESUPUESTO ESTIMADO - ObraTudela\n\n";
                let subtotal = 0;

                presupuesto.forEach(item => {
                    const importe = item.qty * item.precio;
                    subtotal += importe;
                    texto += `• ${item.res}\n`;
                    texto += `  ${item.qty} ${item.uni} × ${item.precio.toFixed(2)} € = ${importe.toFixed(2)} €\n\n`;
                });

                const iva = subtotal * 0.21;
                const total = subtotal + iva;

                texto += "--------------------------------\n";
                texto += `Subtotal: ${subtotal.toFixed(2)} €\n`;
                texto += `IVA (21%): ${iva.toFixed(2)} €\n`;
                texto += `TOTAL: ${total.toFixed(2)} €\n\n`;
                texto += "Generado con la IA de https://www.obratudela.com";
                return { texto, total };
            }

            // --- Inicialización al cargar la página ---
            function initializeChat() {
                loadChatHistory();
                // loadBudget() ya se llama en loadDatabase().then() (línea 512)
                // No llamar aquí para evitar duplicados
            }
            initializeChat();
        });
    </script>
</body>

</html>
