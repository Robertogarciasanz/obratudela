<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuestos PRO — 61.826 Partidas (BCEXTREM + BCCA)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @font-face {
    font-family: 'IBM Plex Sans';
    font-weight: 300;
    font-display: swap;
    src: url('fonts/ibm-plex-sans-300-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-weight: 400;
    font-display: swap;
    src: url('fonts/ibm-plex-sans-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-weight: 600;
    font-display: swap;
    src: url('fonts/ibm-plex-sans-600-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Bebas Neue';
    font-weight: 400;
    font-display: swap;
    src: url('fonts/bebas-neue-400-latin.woff2') format('woff2');
  }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --primary: #ff6b35;
    --primary-hover: #ff8555;
    --text: #e5e5e5;
    --text-muted: #999;
    --success: #4ade80;
    --warning: #fbbf24;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    overflow: hidden;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 2px solid var(--primary);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--primary);
  }

  .header-badge {
    background: var(--primary);
    color: var(--bg);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .header-actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }

  .btn:hover {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--bg);
  }

  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--bg);
  }

  .btn-primary:hover {
    background: var(--primary-hover);
  }

  /* LAYOUT */
  .container {
    display: flex;
    height: calc(100vh - 60px);
    overflow: hidden;
  }

  .sidebar {
    width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .search-box {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .search-box input {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .results-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .result-item {
    padding: 12px;
    margin-bottom: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .result-item:hover {
    border-color: var(--primary);
    background: var(--surface);
  }

  .result-code {
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .result-title {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .result-price {
    font-size: 12px;
    color: var(--success);
    font-weight: 600;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .detail-panel {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }

  .detail-header {
    margin-bottom: 24px;
  }

  .detail-code {
    font-size: 14px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .detail-title {
    font-size: 20px;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .detail-price {
    font-size: 24px;
    color: var(--success);
    font-weight: 600;
  }

  .detail-section {
    background: var(--surface);
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }

  .detail-section h3 {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 12px;
  }

  .detail-desc {
    color: var(--text-muted);
    line-height: 1.8;
  }

  .budget-panel {
    width: 400px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .budget-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .budget-header h2 {
    font-size: 18px;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .budget-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .budget-item {
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
  }

  .budget-item-code {
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .budget-item-title {
    font-size: 12px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .budget-item-qty {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }

  .budget-item-qty input {
    width: 60px;
    padding: 4px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
  }

  .budget-item-total {
    font-size: 14px;
    color: var(--success);
    font-weight: 600;
    text-align: right;
  }

  .budget-footer {
    padding: 16px;
    border-top: 2px solid var(--border);
    background: var(--surface2);
  }

  .budget-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .budget-total-label {
    font-size: 16px;
    color: var(--text-muted);
  }

  .budget-total-value {
    font-size: 24px;
    color: var(--success);
    font-weight: 600;
  }

  .loading {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .loading-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    margin-top: 20px;
    font-size: 16px;
    color: var(--text-muted);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .empty-state-title {
    font-size: 18px;
    margin-bottom: 8px;
    color: var(--text);
  }

  .empty-state-desc {
    font-size: 14px;
  }

  .delete-btn {
    padding: 4px 8px;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    margin-top: 8px;
  }

  .delete-btn:hover {
    background: #b91c1c;
  }

  .add-btn {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
  }

  .add-btn:hover {
    background: var(--primary-hover);
  }

  .add-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Cargando base de datos combinada...</div>
</div>

<div class="header">
  <div class="header-left">
    <h1>PRESUPUESTOS PRO</h1>
    <div class="header-badge">61.826 PARTIDAS</div>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="exportarBC3()">Exportar BC3</button>
    <button class="btn" onclick="exportarExcel()">Exportar Excel</button>
    <button class="btn" onclick="exportarPDF()">Exportar PDF</button>
    <button class="btn btn-primary" onclick="nuevoPresupuesto()">Nuevo Presupuesto</button>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar partidas... (código, descripción)" autocomplete="off">
    </div>
    <div class="results-list" id="resultsList">
      <div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-title">Busca partidas</div>
        <div class="empty-state-desc">Escribe para buscar entre 61.826 partidas</div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="detail-panel" id="detailPanel">
      <div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-title">Selecciona una partida</div>
        <div class="empty-state-desc">Busca y selecciona una partida para ver sus detalles</div>
      </div>
    </div>
  </div>

  <div class="budget-panel">
    <div class="budget-header">
      <h2>Mi Presupuesto</h2>
      <div style="font-size: 12px; color: var(--text-muted);">0 partidas</div>
    </div>
    <div class="budget-list" id="budgetList">
      <div class="empty-state">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-title">Presupuesto vacío</div>
        <div class="empty-state-desc">Añade partidas para comenzar</div>
      </div>
    </div>
    <div class="budget-footer">
      <div class="budget-total">
        <div class="budget-total-label">TOTAL:</div>
        <div class="budget-total-value" id="budgetTotal">0.00 €</div>
      </div>
    </div>
  </div>
</div>

<script>
let database = [];
let selectedItem = null;
let budgetItems = [];

// Cargar base de datos
async function loadDatabase() {
  const loadingText = document.querySelector('.loading-text');
  try {
    loadingText.textContent = 'Descargando base de datos (18 MB)...';

    const response = await fetch('precios-combinado.json');

    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }

    const contentLength = response.headers.get('content-length');
    const total = parseInt(contentLength, 10);
    let loaded = 0;

    const reader = response.body.getReader();
    const chunks = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      chunks.push(value);
      loaded += value.length;
      const percent = Math.round((loaded / total) * 100);
      loadingText.textContent = `Descargando base de datos... ${percent}%`;
    }

    loadingText.textContent = 'Procesando datos...';
    const blob = new Blob(chunks);
    const text = await blob.text();
    database = JSON.parse(text);

    document.getElementById('loading').style.display = 'none';
    console.log(`Base de datos cargada: ${database.length} partidas`);
  } catch (error) {
    console.error('Error cargando base de datos:', error);
    loadingText.textContent = 'Error cargando la base de datos. Verifica que el servidor esté activo en http://localhost:8080';
  }
}

// Buscar partidas
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const query = e.target.value.trim().toLowerCase();
    if (query.length < 2) {
      showEmptySearch();
      return;
    }

    const results = database.filter(item =>
      item.cod.toLowerCase().includes(query) ||
      item.res.toLowerCase().includes(query) ||
      (item.desc && item.desc.toLowerCase().includes(query))
    ).slice(0, 50);

    displayResults(results);
  }, 300);
});

function showEmptySearch() {
  document.getElementById('resultsList').innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">🔍</div>
      <div class="empty-state-title">Busca partidas</div>
      <div class="empty-state-desc">Escribe para buscar entre 61.826 partidas</div>
    </div>
  `;
}

function displayResults(results) {
  const container = document.getElementById('resultsList');

  if (results.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">❌</div>
        <div class="empty-state-title">Sin resultados</div>
        <div class="empty-state-desc">Intenta con otros términos</div>
      </div>
    `;
    return;
  }

  container.innerHTML = results.map(item => `
    <div class="result-item" onclick='selectItem(${JSON.stringify(item).replace(/'/g, "\\'")})'>
      <div class="result-code">${item.cod}</div>
      <div class="result-title">${item.res}</div>
      <div class="result-price">${item.pre.toFixed(2)} €/${item.uni}</div>
    </div>
  `).join('');
}

function selectItem(item) {
  selectedItem = item;
  displayItemDetail(item);
}

function displayItemDetail(item) {
  const panel = document.getElementById('detailPanel');
  const source = item.fuente ? `<span style="color: var(--warning); font-size: 12px;">📍 ${item.fuente}</span>` : '';

  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-code">${item.cod} ${source}</div>
      <div class="detail-title">${item.res}</div>
      <div class="detail-price">${item.pre.toFixed(2)} €/${item.uni}</div>
    </div>

    ${item.desc ? `
      <div class="detail-section">
        <h3>Descripción</h3>
        <div class="detail-desc">${item.desc}</div>
      </div>
    ` : ''}

    <div class="detail-section">
      <h3>Añadir al Presupuesto</h3>
      <label style="display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 13px;">Cantidad:</label>
      <input type="number" id="itemQty" value="1" min="0.01" step="0.01"
        style="width: 120px; padding: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 14px;">
      <button class="add-btn" onclick="addToBudget()">Añadir al Presupuesto</button>
    </div>
  `;
}

function addToBudget() {
  if (!selectedItem) return;

  const qty = parseFloat(document.getElementById('itemQty').value) || 1;

  budgetItems.push({
    ...selectedItem,
    qty: qty,
    total: selectedItem.pre * qty
  });

  updateBudgetDisplay();
}

function updateBudgetDisplay() {
  const container = document.getElementById('budgetList');
  const totalEl = document.getElementById('budgetTotal');

  if (budgetItems.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-title">Presupuesto vacío</div>
        <div class="empty-state-desc">Añade partidas para comenzar</div>
      </div>
    `;
    totalEl.textContent = '0.00 €';
    document.querySelector('.budget-header div').textContent = '0 partidas';
    return;
  }

  container.innerHTML = budgetItems.map((item, index) => `
    <div class="budget-item">
      <div class="budget-item-code">${item.cod}</div>
      <div class="budget-item-title">${item.res}</div>
      <div class="budget-item-qty">
        <input type="number" value="${item.qty}" min="0.01" step="0.01"
          onchange="updateItemQty(${index}, this.value)">
        <span style="font-size: 11px; color: var(--text-muted);">${item.uni}</span>
        <span style="font-size: 11px; color: var(--text-muted);">× ${item.pre.toFixed(2)} €</span>
      </div>
      <div class="budget-item-total">${item.total.toFixed(2)} €</div>
      <button class="delete-btn" onclick="removeFromBudget(${index})">Eliminar</button>
    </div>
  `).join('');

  const total = budgetItems.reduce((sum, item) => sum + item.total, 0);
  totalEl.textContent = total.toFixed(2) + ' €';
  document.querySelector('.budget-header div').textContent = `${budgetItems.length} partidas`;
}

function updateItemQty(index, newQty) {
  const qty = parseFloat(newQty) || 0;
  budgetItems[index].qty = qty;
  budgetItems[index].total = budgetItems[index].pre * qty;
  updateBudgetDisplay();
}

function removeFromBudget(index) {
  budgetItems.splice(index, 1);
  updateBudgetDisplay();
}

function nuevoPresupuesto() {
  if (budgetItems.length > 0) {
    if (!confirm('¿Seguro que quieres borrar el presupuesto actual?')) return;
  }
  budgetItems = [];
  updateBudgetDisplay();
}

function exportarExcel() {
  if (budgetItems.length === 0) {
    alert('El presupuesto está vacío');
    return;
  }

  const ws_data = [
    ['Código', 'Descripción', 'Unidad', 'Cantidad', 'Precio', 'Total'],
    ...budgetItems.map(item => [
      item.cod,
      item.res,
      item.uni,
      item.qty,
      item.pre,
      item.total
    ]),
    [],
    ['', '', '', '', 'TOTAL:', budgetItems.reduce((sum, item) => sum + item.total, 0)]
  ];

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(ws_data);
  XLSX.utils.book_append_sheet(wb, ws, 'Presupuesto');
  XLSX.writeFile(wb, 'presupuesto.xlsx');
}

function exportarPDF() {
  if (budgetItems.length === 0) {
    alert('El presupuesto está vacío');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.text('PRESUPUESTO', 20, 20);

  doc.setFontSize(10);
  let y = 40;

  budgetItems.forEach(item => {
    if (y > 270) {
      doc.addPage();
      y = 20;
    }

    doc.text(item.cod, 20, y);
    doc.text(item.res.substring(0, 60), 20, y + 5);
    doc.text(`${item.qty} ${item.uni} x ${item.pre.toFixed(2)} EUR = ${item.total.toFixed(2)} EUR`, 20, y + 10);
    y += 20;
  });

  const total = budgetItems.reduce((sum, item) => sum + item.total, 0);
  doc.setFontSize(14);
  doc.text(`TOTAL: ${total.toFixed(2)} EUR`, 20, y + 10);

  doc.save('presupuesto.pdf');
}

function exportarBC3() {
  if (budgetItems.length === 0) {
    alert('El presupuesto está vacío');
    return;
  }

  let bc3Content = '~V|FIEBDC-3/2007|ANSI||\n';

  budgetItems.forEach(item => {
    bc3Content += `~C|${item.cod}|${item.uni}|${item.res}|${item.pre}|0||0|\n`;
    if (item.desc) {
      bc3Content += `~D|${item.cod}|${item.desc}|\n`;
    }
    bc3Content += `~M|${item.cod}|${item.qty}|${item.total}|\n`;
  });

  const blob = new Blob([bc3Content], { type: 'text/plain;charset=ISO-8859-1' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'presupuesto.bc3';
  a.click();
  URL.revokeObjectURL(url);
}

// Inicializar
loadDatabase();
</script>

</body>
</html>
